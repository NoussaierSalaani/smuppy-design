<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
.cdim{position:absolute;inset:0;background:rgba(2,8,6,.78);backdrop-filter:blur(2px)}
.csheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:#0A1311;
  border:1px solid var(--line);border-bottom:none;border-radius:34px 34px 0 0;padding:20px 22px 40px}
.csheet .grab{width:54px;height:5px;border-radius:3px;background:#2c3a36;margin:0 auto 22px}
.csheet h3{color:#fff;font-size:26px;font-weight:800;margin-bottom:4px}
.csheet .ss{color:#8fa39c;font-size:16px;margin-bottom:22px}
.crow2{display:flex;align-items:center;gap:16px;padding:18px;border:1px solid var(--line);
  border-radius:20px;margin-bottom:14px;background:rgba(84,214,166,.04)}
.crow2 .itile{width:54px;height:54px;font-size:27px}
.crow2 .t{color:#fff;font-size:21px;font-weight:800}
.crow2 .d{color:#8fa39c;font-size:15px;margin-top:3px}
.crow2 .ar{margin-left:auto;color:var(--accent);font-size:24px}
.cbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.5)}
</style></head><body>
<div class="cap-band"><h2>Crée en quelques secondes</h2><div class="sub">Post, Peak ou live — en un geste.</div></div>
<div class="device">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span>5G ▪ 100%</span></div>
  <div class="screen full">
    <div class="cbg" style="background-image:url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=700&q=80')"></div>
    <div class="cdim"></div>
    <div class="csheet">
      <div class="grab"></div>
      <h3>Que veux-tu créer ?</h3><div class="ss">Choisis un format et lance-toi.</div>
      <div class="crow2"><div class="itile">🖼</div><div><div class="t">Post</div><div class="d">Photo, carrousel, légende</div></div><div class="ar">›</div></div>
      <div class="crow2"><div class="itile">▶</div><div><div class="t">Peak</div><div class="d">Vidéo verticale 15–60s</div></div><div class="ar">›</div></div>
      <div class="crow2"><div class="itile">📡</div><div><div class="t">Go Live <span style="color:#FF3B5C">●</span></div><div class="d">Stream en direct avec ta tribu</div></div><div class="ar">›</div></div>
    </div></div>
</div>
</body></html>
