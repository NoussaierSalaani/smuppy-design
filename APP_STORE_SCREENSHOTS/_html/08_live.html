<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
.lvbg{position:absolute;inset:0;background-size:cover;background-position:center}
.lvbg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 52%,rgba(0,0,0,.86) 100%)}
.lv-top{position:absolute;top:60px;left:18px;right:18px;z-index:4;display:flex;align-items:center;gap:12px}
.lv-top .avatar{width:50px;height:50px;border:2px solid #fff}
.lv-top .nm{color:#fff;font-size:19px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.lv-top .vc{color:#dfeee8;font-size:14px}
.lv-top .live-tag{position:static}
.lv-top .foll{margin-left:auto;background:#fff;color:#04130f;font-size:15px;font-weight:800;padding:9px 18px;border-radius:999px}
.lvchat{position:absolute;left:18px;right:96px;bottom:120px;z-index:4;display:flex;flex-direction:column;gap:11px}
.cmt{display:flex;align-items:flex-start;gap:10px}
.cmt .avatar{width:32px;height:32px;flex:none}
.cmt .tx{color:#fff;font-size:15px;line-height:1.3;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.cmt .tx b{font-weight:800;margin-right:6px}
.reacts{position:absolute;right:18px;bottom:120px;z-index:4;display:flex;flex-direction:column;gap:20px;align-items:center}
.reacts .r{display:flex;flex-direction:column;align-items:center;color:#fff;font-size:13px;font-weight:700}
.reacts .r .ico{font-size:34px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.lvbar{position:absolute;bottom:0;left:0;right:0;z-index:4;padding:18px 20px 32px;display:flex;gap:12px}
.lvbar .field{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
  border-radius:22px;padding:14px 18px;color:#e8f4ef;font-size:16px;backdrop-filter:blur(6px)}
.heart{position:absolute;right:38px;bottom:330px;z-index:3;font-size:40px;opacity:.85}
.heart.h2{right:64px;bottom:400px;font-size:28px;opacity:.6}
</style></head><body>
<div class="cap-band"><h2>Lives interactifs en direct</h2><div class="sub">Rejoins le live, commente, réagis en temps réel.</div></div>
<div class="device">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span>5G ▪ 100%</span></div>
  <div class="screen full">
    <div class="lvbg" style="background-image:url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?w=900&q=80')"></div>
    <div class="lv-top">
      <div class="avatar" style="background-image:url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&q=80')"></div>
      <div><div class="nm">Karim B.</div><div class="vc">👁 1 248 spectateurs</div></div>
      <span class="live-tag"><span class="dot"></span>LIVE</span>
    </div>
    <div class="heart">❤️</div><div class="heart h2">❤️</div>
    <div class="reacts">
      <div class="r"><div class="ico">❤️</div>2,4k</div>
      <div class="r"><div class="ico">🔥</div>891</div>
      <div class="r"><div class="ico">👊</div>Smups</div>
      <div class="r"><div class="ico">↗</div>Partager</div>
    </div>
    <div class="lvchat">
      <div class="cmt"><div class="avatar" style="background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&q=80')"></div><div class="tx"><b>Nora</b>Technique au top 🔥</div></div>
      <div class="cmt"><div class="avatar" style="background-image:url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&q=80')"></div><div class="tx"><b>Tom</b>On enchaîne combien de rounds ?</div></div>
      <div class="cmt"><div class="avatar" style="background-image:url('https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150&q=80')"></div><div class="tx"><b>Maya</b>Première fois en live, j'adore 💚</div></div>
    </div>
    <div class="lvbar"><div class="field">Dis quelque chose…</div></div></div>
</div>
</body></html>
