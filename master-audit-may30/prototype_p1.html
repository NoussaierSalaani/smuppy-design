<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<title>Smuppy V2 — P1 Settings/Messages/Notifs/Profile-subs</title>
<meta http-equiv="Cache-Control" content="no-cache">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:radial-gradient(circle at 50% 0%, #1a1a25 0%, #050508 70%);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#F1F4F6;overflow:hidden}
  .stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;gap:32px}
  .sidebar{width:280px;max-height:92vh;overflow-y:auto;background:rgba(20,20,26,0.65);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,0.06);border-radius:24px;padding:20px 16px}
  .sidebar h1{font-size:17px;font-weight:800;margin-bottom:4px}
  .sidebar .subtitle{font-size:11px;color:#8B8B95;margin-bottom:18px}
  .sidebar h2{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#26C1A4;margin:16px 8px 8px}
  .sidebar h2:first-of-type{margin-top:0}
  .sidebar button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:11px;background:transparent;border:1px solid transparent;color:#C8C9D0;font:600 12.5px/1.5 inherit;text-align:left;cursor:pointer;margin-bottom:3px;transition:.15s}
  .sidebar button:hover{background:rgba(38,193,164,.06);border-color:rgba(38,193,164,.20);color:#F1F4F6}
  .sidebar button.active{background:rgba(38,193,164,.12);border-color:rgba(38,193,164,.40);color:#26C1A4;box-shadow:0 0 16px rgba(38,193,164,.20)}
  .theme-tabs{display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);border-radius:12px;margin:0 8px 14px}
  .theme-tabs button{flex:1;padding:7px 8px;border-radius:8px;background:transparent;border:none;color:#8B8B95;font:700 11px inherit;cursor:pointer;margin-bottom:0 !important}
  .theme-tabs button.active{background:#26C1A4;color:#000}
  .phone{position:relative;width:393px;height:852px;border-radius:50px;background:#000;box-shadow:0 50px 120px rgba(0,0,0,.7),0 0 0 12px #1c1c20,0 0 0 13px #34343c,0 0 0 14px #1c1c20,0 30px 90px rgba(38,193,164,.10);overflow:hidden}
  .phone-notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#000;border-radius:18px;z-index:100}
  .phone iframe{width:100%;height:100%;border:none;border-radius:50px}
  @media (max-width:980px){.sidebar{display:none}}
</style></head><body>
<div class="stage">
  <aside class="sidebar">
    <h1>Sprint P1 · Settings / Messages / Notifs / Profile</h1>
    <p class="subtitle">19 écrans canonical V2</p>
    <div class="theme-tabs">
      <button class="active" data-theme="dark">Dark</button>
      <button data-theme="light">Light</button>
    </div>
    <h2>Settings (8)</h2>
    <button class="active" data-key="p1_settings">Réglages (entry)</button>
    <button data-key="p1_edit_profile">Modifier profil</button>
    <button data-key="p1_notification_settings">Notifications</button>
    <button data-key="p1_privacy_settings">Confidentialité</button>
    <button data-key="p1_security_settings">Sécurité</button>
    <button data-key="p1_manage_subscription">Abonnements</button>
    <button data-key="p1_upgrade_to_pro">Upgrade Pro</button>
    <button data-key="p1_report_problem">Signaler</button>
    <h2>Messages (4)</h2>
    <button data-key="p1_messages">Messages list</button>
    <button data-key="p1_chat">Chat conversation</button>
    <button data-key="p1_new_message">Nouveau message</button>
    <button data-key="p1_create_group_chat">Nouveau groupe</button>
    <h2>Notifications (2)</h2>
    <button data-key="p1_notifications">Notifications list</button>
    <button data-key="p1_follow_requests">Demandes de fan</button>
    <h2>Profile sub (5)</h2>
    <button data-key="p1_fans_list">Fans list</button>
    <button data-key="p1_post_likers">Post likers</button>
    <button data-key="p1_player_abilities">Player abilities</button>
    <button data-key="p1_player_career_card">Career card</button>
    <button data-key="p1_my_ratings_settings">Mes notes (privacy)</button>
  </aside>
  <div class="phone"><div class="phone-notch"></div><iframe id="phone-frame" src="maquettes/harmonized/p1_settings_v2_dark/code.html"></iframe></div>
</div>
<script>
  const frame=document.getElementById('phone-frame');
  const sBtns=document.querySelectorAll('.sidebar button[data-key]');
  const tBtns=document.querySelectorAll('.theme-tabs button');
  let theme='dark',key='p1_settings';
  function upd(){frame.src=`maquettes/harmonized/${key}_v2_${theme}/code.html?v=${Date.now()}`}
  sBtns.forEach(b=>b.addEventListener('click',()=>{key=b.dataset.key;sBtns.forEach(x=>x.classList.toggle('active',x===b));upd()}));
  tBtns.forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.theme;tBtns.forEach(x=>x.classList.toggle('active',x===b));upd()}));
</script>
</body></html>
