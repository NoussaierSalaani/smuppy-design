<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smuppy V2 — Run (live)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0c;color:#F1F4F6;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:28px}
h1{font-size:22px;font-weight:800;margin-bottom:4px}
.sub{color:#8B8B95;font-size:13px;font-weight:500;margin-bottom:8px}
.tog{margin:14px 0 22px}
.tog button{padding:8px 18px;border:1px solid #2a2a32;background:#14141A;color:#F1F4F6;border-radius:999px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;margin-right:8px}
.tog button.on{background:#33A089;border-color:#33A089;color:#fff}
.grp{font-size:13px;font-weight:800;color:#33A089;letter-spacing:.06em;text-transform:uppercase;margin:26px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
.phone{background:#14141A;border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:12px}
.frame{width:100%;height:0;padding-bottom:217%;position:relative;border-radius:14px;overflow:hidden;background:#000}
.frame iframe{position:absolute;top:0;left:0;width:393px;height:852px;border:0;transform-origin:top left}
.cap{margin-top:10px;font-size:12px;font-weight:700;color:#C9CdD2;text-align:center}
</style></head><body>
<h1>Smuppy V2 — Run · flow rapide (live)</h1>
<div class="sub">15 écrans rendus en direct · map → DÉPART → compte à rebours → tracking → stop → stats/share</div>
<div class="tog"><button id="bd" class="on" onclick="setTh('dark')">🌙 Dark</button><button id="bl" onclick="setTh('light')">☀️ Light</button></div>
<div id="root"></div>
<script>
const GROUPS={
 "1 · Démarrage":[["run_permission_v2","Permission GPS"],["run_gps_denied_v2","GPS refusé"],["run_start_v2","Map + DÉPART"],["run_countdown_v2","Compte à rebours"],["run_gps_search_v2","Recherche GPS"]],
 "2 · En cours":[["run_tracking_v2","Tracking"],["run_paused_v2","Pause"],["run_stop_confirm_v2","Confirmer stop"]],
 "3 · Après":[["run_share_v2","Save & Share"],["run_published_v2","Publié"],["run_discard_confirm_v2","Abandonner ?"]],
 "4 · Mes runs":[["run_history_v2","Historique"],["run_records_v2","Records"],["run_detail_v2","Détail splits"],["run_empty_v2","Vide"]],
};
let TH='dark';
function scaleFrames(){document.querySelectorAll('.frame').forEach(fr=>{const w=fr.clientWidth;fr.querySelector('iframe').style.transform='scale('+(w/393)+')';});}
function build(){const root=document.getElementById('root');root.innerHTML='';
 for(const[g,items]of Object.entries(GROUPS)){
  const h=document.createElement('div');h.className='grp';h.textContent=g;root.appendChild(h);
  const grid=document.createElement('div');grid.className='grid';
  for(const[name,cap]of items){
   const c=document.createElement('div');c.className='phone';
   c.innerHTML=`<div class="frame"><iframe loading="lazy" src="../harmonized/${name}_${TH}/code.html"></iframe></div><div class="cap">${cap}</div>`;
   grid.appendChild(c);
  }
  root.appendChild(grid);
 }
 setTimeout(scaleFrames,60);
}
function setTh(t){TH=t;document.getElementById('bd').className=t==='dark'?'on':'';document.getElementById('bl').className=t==='light'?'on':'';build();}
window.addEventListener('resize',scaleFrames);
build();
</script></body></html>
