<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=393, initial-scale=1" />
<title>activity_attendees_v2 — dark</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 393px;
    height: 852px;
    overflow: hidden;
    background: #0A0E1A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .screen {
    width: 393px;
    height: 852px;
    background: #0A0E1A;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* faux iOS status bar */
  .statusbar {
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px 0 28px;
    color: #FFFFFF;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
  .statusbar .glyphs { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .statusbar .bars { letter-spacing: 1px; }
  .statusbar .batt {
    width: 24px; height: 12px; border: 1px solid #FFFFFF; border-radius: 3px;
    position: relative; display: inline-block;
  }
  .statusbar .batt::after {
    content: ""; position: absolute; right: -3px; top: 3px;
    width: 2px; height: 6px; background: #FFFFFF; border-radius: 0 1px 1px 0;
  }
  .statusbar .batt::before {
    content: ""; position: absolute; left: 1px; top: 1px; bottom: 1px;
    width: 16px; background: #FFFFFF; border-radius: 1px;
  }

  /* settings_topbar — back + centered title */
  .header {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 8px 12px 6px 12px;
    flex-shrink: 0;
  }
  .backBtn {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
  }
  .back {
    font-size: 30px; line-height: 34px; font-weight: 400;
    color: #FFFFFF; text-align: center;
  }
  .headerTitle {
    flex: 1; text-align: center;
    font-size: 18px; font-weight: 800; letter-spacing: -0.3px;
    color: #FFFFFF;
  }
  .headerSpacer { width: 44px; }

  /* count header */
  .countWrap {
    padding: 6px 20px 12px 20px;
    border-bottom: 0.5px solid #2A3142;
    flex-shrink: 0;
  }
  .countText {
    font-size: 14px; font-weight: 600; letter-spacing: -0.2px;
    color: #94A3B8;
  }

  /* list */
  .list {
    flex: 1;
    padding: 8px 20px 40px 20px;
    overflow: hidden;
  }
  .row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 0.5px solid #2A3142;
    gap: 12px;
    min-height: 44px;
  }
  .rowInfo {
    display: flex; flex-direction: row; align-items: center;
    gap: 12px; flex: 1; min-width: 0;
  }
  /* Avatar md — mini-card rounded square */
  .avatar {
    width: 44px; height: 44px;
    border-radius: 12px;
    flex-shrink: 0;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar img { width: 44px; height: 44px; object-fit: cover; display: block; }
  .avatar.initials {
    background: #1E2435;
  }
  .avatar .ini {
    color: #FFFFFF; font-size: 17px; font-weight: 600;
  }
  .rowText { flex: 1; min-width: 0; }
  .nameRow { display: flex; flex-direction: row; align-items: center; gap: 4px; }
  .rowName {
    font-size: 15px; font-weight: 600; letter-spacing: -0.2px;
    color: #FFFFFF;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .verified {
    font-size: 13px; font-weight: 700; line-height: 16px;
    color: #33A089;
    flex-shrink: 0;
  }
  .rowHandle {
    font-size: 13px; font-weight: 500; margin-top: 1px;
    color: #94A3B8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* role badge — per-mode dark graphic chip (>=3:1) */
  .roleBadge {
    padding: 5px 10px;
    border-radius: 12px;
    border-width: 1.5px;
    border-style: solid;
    align-self: center;
    flex-shrink: 0;
  }
  .roleText {
    font-size: 12px; font-weight: 700; letter-spacing: -0.1px;
    white-space: nowrap;
  }
  /* dark-mode role ink: host #34D399, going #93C5FD, waitlist #FBBF24 */
  .role-host    { border-color: #34D399; }
  .role-host    .roleText { color: #34D399; }
  .role-going   { border-color: #93C5FD; }
  .role-going   .roleText { color: #93C5FD; }
  .role-waitlist{ border-color: #FBBF24; }
  .role-waitlist .roleText { color: #FBBF24; }
</style>
</head>
<body>
  <div class="screen">

    <!-- faux iOS status bar -->

      <!-- a3: waitlist, verified, photo -->
      <div class="row">

            <span class="ini">AD</span>

            <div class="nameRow">

            <div class="nameRow">

        </div>
        <div class="roleBadge role-going"><span class="roleText">Confirm&eacute;</span></div>
      </div>

      <!-- extra realistic rows to fill the roster -->
      <div class="row">
        <div class="rowInfo">
          <div class="avatar initials" style="background:#176A5A;">
            <span class="ini">SR</span>
          </div>
          <div class="rowText">
            <div class="nameRow">
              <span class="rowName">Sofia Rossi</span>
              <span class="verified">&#10003;</span>
            </div>
            <div class="rowHandle">@sofia.cycle</div>
          </div>
        </div>
        <div class="roleBadge role-going"><span class="roleText">Confirm&eacute;</span></div>
      </div>

      <div class="row">
        <div class="rowInfo">
          <div class="avatar initials" style="background:#64748B;">
            <span class="ini">TK</span>
          </div>
          <div class="rowText">
            <div class="nameRow">
              <span class="rowName">Thomas Keller</span>
            </div>
            <div class="rowHandle">@thomas.trail</div>
          </div>
        </div>
        <div class="roleBadge role-waitlist"><span class="roleText">Liste d'attente</span></div>
      </div>

    </div>

  </div>
</body>
</html>
