<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ActivitySessionView — V2 Dark</title>
<style>
  /* ===== V2 DARK TOKENS (exact) ===== */
  :root {
    --surface: #0A0E1A;
    --surfaceContainer: #161B2A;
    --surfaceContainerHigh: #1E2435;
    --onSurface: #FFFFFF;
    --onSurfaceVariant: #94A3B8;
    --outline: #2A3142;
    --mint: #33A089;
    --info: #60A5FA;
    --success: #34D399;
    --warning: #FBBF24;
    --danger: #F87171;
    /* status meaning constants — dark mode (from STATUS map) */
    --status-live: #FF6B78;   /* live red dot, dark */
    --status-warn: #FBBF24;   /* paused / weak gps, dark */
    --status-danger: #F87171; /* lost gps / offline, dark */
    --map-scrim: rgba(10,14,26,0.62);
    --on-map: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #05070f;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 24px 0;
  }

  /* ===== DEVICE 393 x 852 ===== */
  .device {
    width: 393px;
    height: 852px;
    background: var(--surface);
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
  }

  /* ===== FAUX iOS STATUS BAR (inside the 54px safe-area inset) ===== */
  .statusbar {
    height: 54px;
    flex: 0 0 54px;
    background: var(--surface);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 26px 8px;
    z-index: 5;
  }
  .statusbar .time {
    color: var(--onSurface);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .statusbar .icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .statusbar .icons svg { display: block; }

  /* ===== APP ROOT (flex column, fills below the safe-area) ===== */
  .root {
    flex: 1 1 auto;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ---------- HEADER ---------- */
  .header {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 0.5px solid var(--outline);
    gap: 10px;
  }
  .header-title {
    flex: 1;
    color: var(--onSurface);
    font-size: 17px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-right {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }
  .badge {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--surfaceContainer);
  }
  .badge-text {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--onSurface);
  }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: 0 0 8px; }
  .chat-btn {
    width: 44px; height: 44px;
    border-radius: 999px;
    background: var(--surfaceContainer);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .chat-btn svg { display: block; }

  /* ---------- SCROLL BODY ---------- */
  .scroll {
    flex: 1 1 auto;
    overflow: hidden;
    padding: 16px;
    padding-bottom: 24px;
  }

  /* ---------- MAP (route mode) ---------- */
  .map {
    height: 220px;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 16px;
    background: var(--surfaceContainer);
    position: relative;
  }
  .map-canvas {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 22% 30%, rgba(51,160,137,0.10), transparent 45%),
      radial-gradient(circle at 78% 72%, rgba(96,165,250,0.08), transparent 45%),
      repeating-linear-gradient(0deg, rgba(42,49,66,0.55) 0, rgba(42,49,66,0.55) 1px, transparent 1px, transparent 34px),
      repeating-linear-gradient(90deg, rgba(42,49,66,0.55) 0, rgba(42,49,66,0.55) 1px, transparent 1px, transparent 34px),
      #11162400;
  }
  .route-path { position: absolute; inset: 0; }

  /* ---------- BIG TIMER CARD ---------- */
  .timer-card {
    background: var(--surfaceContainer);
    border-radius: 20px;
    margin-bottom: 16px;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .timer-text {
    color: var(--onSurface);
    font-size: 52px;
    font-weight: 800;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .timer-label {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--onSurfaceVariant);
  }

  /* ---------- STATS GRID ---------- */
  .stats-grid {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    margin: 0 -4px 16px;
  }
  .stat-cell {
    flex: 1 1 28%;
    min-width: 88px;
    margin: 4px;
    padding: 14px 6px;
    border-radius: 16px;
    border: 0.5px solid var(--outline);
    background: var(--surfaceContainer);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stat-value-row {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    justify-content: center;
  }
  .stat-value {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.4px;
    font-variant-numeric: tabular-nums;
    color: var(--onSurface);
  }
  .stat-value.accent { color: var(--mint); }
  .stat-unit {
    margin-left: 3px;
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--onSurfaceVariant);
  }
  .stat-label {
    margin-top: 3px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--onSurfaceVariant);
  }

  /* ---------- PARTICIPANTS ---------- */
  .section-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--onSurface);
    margin: 4px 0 12px;
  }
  .p-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    min-height: 44px;
    border-radius: 16px;
    border: 0.5px solid var(--outline);
    background: var(--surfaceContainer);
    margin-bottom: 8px;
  }
  .p-row.self {
    background: var(--surfaceContainerHigh);
    border-color: var(--mint);
  }
  .p-avatar {
    width: 40px; height: 40px;
    border-radius: 999px;
    overflow: hidden;
    flex: 0 0 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
  }
  .p-text { flex: 1; min-width: 0; }
  .p-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--onSurface);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .p-metric {
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
    color: var(--onSurfaceVariant);
  }
  .p-self-dot {
    width: 10px; height: 10px;
    border-radius: 999px;
    background: var(--mint);
    flex: 0 0 10px;
  }

  /* ---------- FOOTER / CONTROLS ---------- */
  .footer {
    padding: 14px 16px 24px;
    border-top: 0.5px solid var(--outline);
    background: var(--surface);
    display: flex;
    flex-direction: row;
    gap: 12px;
  }
  .control { flex: 1; }

  .btn {
    height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 600;
    width: 100%;
  }
  /* outline variant — mint contour, no fill */
  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--mint);
    color: var(--mint);
    border-radius: 14px;
  }
  /* gradient variant — CTA, white ink, pill radius */
  .btn-gradient {
    background: linear-gradient(135deg, #1A7D68, #157082);
    color: #FFFFFF;
    border: none;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="device">

    <!-- FAUX iOS STATUS BAR (54px top safe-area inset) -->
    <div class="statusbar">
      <span class="time">9:41</span>
      <span class="icons">
        <!-- signal -->
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
          <rect x="0" y="8" width="3" height="4" rx="1" fill="#FFFFFF"/>
          <rect x="5" y="5" width="3" height="7" rx="1" fill="#FFFFFF"/>
          <rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#FFFFFF"/>
          <rect x="15" y="0" width="3" height="12" rx="1" fill="#FFFFFF"/>
        </svg>
        <!-- wifi -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <path d="M8.5 2.2c2.7 0 5.2 1 7 2.8l-1.4 1.5A8 8 0 0 0 8.5 4.2 8 8 0 0 0 2.9 6.5L1.5 5A9.9 9.9 0 0 1 8.5 2.2Z" fill="#FFFFFF"/>
          <path d="M8.5 6c1.5 0 2.9.6 4 1.6l-1.5 1.5A3.6 3.6 0 0 0 8.5 8a3.6 3.6 0 0 0-2.5 1.1L4.5 7.6A5.7 5.7 0 0 1 8.5 6Z" fill="#FFFFFF"/>
          <circle cx="8.5" cy="10.6" r="1.4" fill="#FFFFFF"/>
        </svg>
        <!-- battery -->
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none">
          <rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#FFFFFF" opacity="0.5"/>
          <rect x="2" y="2" width="18" height="9" rx="2" fill="#FFFFFF"/>
          <rect x="24" y="4" width="1.5" height="5" rx="0.75" fill="#FFFFFF" opacity="0.5"/>
        </svg>
      </span>
    </div>

    <!-- APP ROOT -->
    <div class="root">

      <!-- HEADER -->
      <div class="header">
        <div class="header-title">Course du dimanche</div>
        <div class="header-right">
          <!-- LIVE badge -->
          <div class="badge" role="text" aria-label="EN DIRECT">
            <span class="dot" style="background: var(--status-live);"></span>
            <span class="badge-text">EN DIRECT</span>
          </div>
          <!-- Chat -->
          <div class="chat-btn" role="button" aria-label="Discussion de groupe">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-9 8.4 9.5 9.5 0 0 1-3.6-.7L3 21l1.4-4.1A8.38 8.38 0 0 1 3.6 11.5a8.5 8.5 0 0 1 9-8.4 8.38 8.38 0 0 1 8.4 8.4Z"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- SCROLL BODY -->
      <div class="scroll">

        <!-- MAP (route mode) -->
        <div class="map">
          <div class="map-canvas"></div>
          <svg class="route-path" viewBox="0 0 360 220" preserveAspectRatio="none">
            <path d="M40 175 C 90 150, 70 90, 130 95 S 230 150, 250 100 S 320 55, 330 45"
                  fill="none" stroke="#33A089" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
            <circle cx="40" cy="175" r="7" fill="#0A0E1A" stroke="#33A089" stroke-width="3"/>
            <circle cx="330" cy="45" r="6" fill="#33A089"/>
            <circle cx="330" cy="45" r="11" fill="none" stroke="#33A089" stroke-width="2" opacity="0.4"/>
          </svg>
        </div>

        <!-- BIG TIMER CARD -->
        <div class="timer-card" role="text" aria-label="Temps écoulé : 28:30">
          <span class="timer-text">28:30</span>
        </div>

        <!-- STATS GRID -->
        <div class="stats-grid">
          <div class="stat-cell">
            <div class="stat-value-row">
              <span class="stat-value">5,2</span>
              <span class="stat-unit">km</span>
            </div>
            <span class="stat-label">Distance</span>
          </div>
          <div class="stat-cell">
            <div class="stat-value-row">
              <span class="stat-value accent">5'29"</span>
              <span class="stat-unit">/km</span>
            </div>
            <span class="stat-label">Allure</span>
          </div>
          <div class="stat-cell">
            <div class="stat-value-row">
              <span class="stat-value">38</span>
              <span class="stat-unit">m</span>
            </div>
            <span class="stat-label">Dénivelé</span>
          </div>
        </div>

        <!-- PARTICIPANTS -->
        <div class="section-title" role="heading">Participants</div>

        <div class="p-row self" role="button" aria-label="Vous, 5,2 km (vous)" aria-selected="true">
          <div class="p-avatar" style="background:#33A089;">V</div>
          <div class="p-text">
            <div class="p-name">Vous</div>
            <div class="p-metric">5,2 km</div>
          </div>
          <span class="p-self-dot"></span>
        </div>

        <div class="p-row" role="button" aria-label="Sara K., 4,8 km">
          <div class="p-avatar" style="background:#60A5FA;">S</div>
          <div class="p-text">
            <div class="p-name">Sara K.</div>
            <div class="p-metric">4,8 km</div>
          </div>
        </div>

        <div class="p-row" role="button" aria-label="Marc D., 5,5 km">
          <div class="p-avatar" style="background:#FBBF24;">M</div>
          <div class="p-text">
            <div class="p-name">Marc D.</div>
            <div class="p-metric">5,5 km</div>
          </div>
        </div>

        <div class="p-row" role="button" aria-label="Lina T., 3,9 km">
          <div class="p-avatar" style="background:#F87171;">L</div>
          <div class="p-text">
            <div class="p-name">Lina T.</div>
            <div class="p-metric">3,9 km</div>
          </div>
        </div>

      </div>

      <!-- FOOTER / CONTROLS -->
      <div class="footer">
        <div class="control">
          <div class="btn btn-outline" role="button" aria-label="Mettre en pause ou reprendre la séance">Pause</div>
        </div>
        <div class="control">
          <div class="btn btn-gradient" role="button" aria-label="Terminer la séance">Terminer</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
