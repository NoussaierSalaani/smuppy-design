<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=393, initial-scale=1" />
<title>activity_leaderboard_v2 — dark</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 393px;
    height: 852px;
    overflow: hidden;
    background: #0A0E1A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .screen {
    width: 393px;
    height: 852px;
    background: #0A0E1A;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- faux iOS status bar ---- */
  .statusbar {
    height: 54px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 24px 10px;
    color: #FFFFFF;
    flex-shrink: 0;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
  .statusbar .glyphs { display: flex; align-items: center; gap: 6px; }
  .statusbar .glyphs svg { display: block; }

  /* ---- header ---- */
  .header {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 8px 12px 6px;
    flex-shrink: 0;
  }
  .ghostBtn {
    width: 44px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border-radius: 16px;
  }
  .ghostBtn span {
    color: #33A089;
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
    margin-top: -4px;
  }
  .headerSpacer { width: 56px; }
  .headerCenter { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: #FFFFFF;
    text-align: center;
  }
  .subtitle {
    font-size: 12px;
    font-weight: 500;
    color: #94A3B8;
    margin-top: 1px;
    text-align: center;
  }

  /* ---- sort segmented tabs ---- */
  .tabs {
    display: flex;
    flex-direction: row;
    margin: 4px 16px 12px;
    padding: 4px;
    border-radius: 999px;
    border: 0.5px solid #2A3142;
    background: #161B2A;
    gap: 4px;
  }
  .tab {
    flex: 1;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1px;
    color: #33A089;
  }
  .tab.on {
    background: #33A089;
    color: #04130F;
  }

  /* ---- list ---- */
  .list {
    flex: 1;
    padding: 4px 16px 40px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }
  .row {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 10px 12px;
    border-radius: 16px;
    border: 1px solid #2A3142;
    background: #0A0E1A;
    position: relative;
    overflow: hidden;
  }
  .row.me {
    background: #161B2A;
  }
  .meRail {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: #33A089;
  }

  .rankSlot {
    width: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .medal {
    min-width: 32px;
    min-height: 32px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }
  .medalText {
    font-size: 15px;
    font-weight: 800;
  }
  .rankPlain {
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    color: #94A3B8;
  }

  /* avatar mini-card (rounded square r12 = md) */
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1E2435;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 600;
  }
  .avatar img { width: 40px; height: 40px; object-fit: cover; display: block; }

  .nameSlot {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .name {
    flex-shrink: 1;
    font-size: 15px;
    font-weight: 600;
    color: #FFFFFF;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .name.me { font-weight: 800; }
  .youBadge {
    min-height: 20px;
    padding: 0 8px;
    border-radius: 999px;
    background: #33A089;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .youBadgeText {
    font-size: 11px;
    font-weight: 700;
    color: #04130F;
    white-space: nowrap;
  }
  .stat {
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .stat.podium { color: #FFFFFF; }
  .stat.plain { color: #94A3B8; }
</style>
</head>
<body>
  <div class="screen">

    <!-- faux iOS status bar -->
    <div class="statusbar">
      <span class="time">9:41</span>
      <span class="glyphs">
        <!-- signal -->
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
          <rect x="0" y="8" width="3" height="4" rx="1" fill="#FFFFFF"/>
          <rect x="5" y="5" width="3" height="7" rx="1" fill="#FFFFFF"/>
          <rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="#FFFFFF"/>
          <rect x="15" y="0" width="3" height="12" rx="1" fill="#FFFFFF"/>
        </svg>
        <!-- wifi -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <path d="M8.5 2.2c2.7 0 5.2 1 7 2.8l-1.3 1.4A8 8 0 008.5 4 8 8 0 002.8 6.4L1.5 5C3.3 3.2 5.8 2.2 8.5 2.2z" fill="#FFFFFF"/>
          <path d="M8.5 6.1c1.5 0 2.9.6 4 1.6l-1.4 1.4a3.6 3.6 0 00-5.2 0L4.5 7.7c1.1-1 2.5-1.6 4-1.6z" fill="#FFFFFF"/>
          <circle cx="8.5" cy="10.4" r="1.4" fill="#FFFFFF"/>
        </svg>
        <!-- battery -->
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none">
          <rect x="0.5" y="0.5" width="22" height="12" rx="3.2" stroke="#FFFFFF" stroke-opacity="0.5"/>
          <rect x="2" y="2" width="18" height="9" rx="2" fill="#FFFFFF"/>
          <rect x="24" y="4" width="1.6" height="5" rx="0.8" fill="#FFFFFF" fill-opacity="0.5"/>
        </svg>
      </span>
    </div>

    <!-- header -->
    <div class="header">
      <div class="ghostBtn"><span>&lsaquo;</span></div>
      <div class="headerCenter">
        <div class="title">Course du Parc</div>
        <div class="subtitle">Classement</div>
      </div>
      <div class="headerSpacer"></div>
    </div>

    <!-- sort segmented tabs -->
    <div class="tabs">
      <div class="tab on">Plus rapide</div>
      <div class="tab">Distance</div>
      <div class="tab">Meilleur rythme</div>
    </div>

    <!-- leaderboard list -->
    <div class="list">

      <!-- rank 1 — gold podium -->
      <div class="row">
        <div class="rankSlot">
          <div class="medal" style="background:#FBBF24;">
            <span class="medalText" style="color:#0A0E1A;">1</span>
          </div>
        </div>
        <div class="avatar">LM</div>
        <div class="nameSlot">
          <div class="name">Léa Martin</div>
        </div>
        <div class="stat podium">24:12</div>
      </div>

      <!-- rank 2 — silver podium -->
      <div class="row">
        <div class="rankSlot">
          <div class="medal" style="background:#94A3B8;">
            <span class="medalText" style="color:#0A0E1A;">2</span>
          </div>
        </div>
        <div class="avatar">HB</div>
        <div class="nameSlot">
          <div class="name">Hugo Bernard</div>
        </div>
        <div class="stat podium">25:48</div>
      </div>

      <!-- rank 3 — bronze podium (no avatar image → initials) -->
      <div class="row">
        <div class="rankSlot">
          <div class="medal" style="background:#D97706;">
            <span class="medalText" style="color:#FFFFFF;">3</span>
          </div>
        </div>
        <div class="avatar">SR</div>
        <div class="nameSlot">
          <div class="name">Sofia Rossi</div>
        </div>
        <div class="stat podium">26:30</div>
      </div>

      <!-- rank 4 — current user highlighted -->
      <div class="row me">
        <div class="meRail"></div>
        <div class="rankSlot">
          <div class="rankPlain">4</div>
        </div>
        <div class="avatar">TO</div>
        <div class="nameSlot">
          <div class="name me">Toi</div>
          <div class="youBadge"><span class="youBadgeText">Toi</span></div>
        </div>
        <div class="stat plain">27:05</div>
      </div>

      <!-- rank 5 — plain -->
      <div class="row">
        <div class="rankSlot">
          <div class="rankPlain">5</div>
        </div>
        <div class="avatar">MD</div>
        <div class="nameSlot">
          <div class="name">Marc Dubois</div>
        </div>
        <div class="stat plain">28:40</div>
      </div>

    </div>
  </div>
</body>
</html>
