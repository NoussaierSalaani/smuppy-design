<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=393, initial-scale=1" />
<title>profile_personal_owner_v2 — light</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 393px;
    height: 852px;
    overflow: hidden;
    background: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .device {
    position: relative;
    width: 393px;
    height: 852px;
    background: #FFFFFF;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Faux iOS status bar (part of 54px safe-area) ───────────────── */
  .statusbar {
    height: 54px;
    flex: 0 0 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px 0 28px;
    color: #0F172A;
    font-size: 15px;
    font-weight: 600;
    z-index: 30;
    background: #FFFFFF;
  }
  .sb-time { letter-spacing: 0.3px; }
  .sb-glyphs { display: flex; align-items: center; gap: 6px; }
  .sb-glyphs svg { display: block; }

  /* ── Sub-screen header (back chevron in circle + centered title) ── */
  .subhead {
    flex: 0 0 auto;
    position: relative;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    background: #FFFFFF;
  }
  .back-circle {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border-radius: 999px;
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .head-title {
    font-size: 17px;
    font-weight: 700;
    color: #0F172A;
    letter-spacing: -0.2px;
  }
  .head-more {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 38px;
    height: 38px;
    border-radius: 999px;
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Content ─────────────────────────────────────────────────────── */
  .scroll {
    flex: 1 1 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── ProfileHeader ───────────────────────────────────────────────── */
  .pheader { width: 100%; }

  .cover {
    position: relative;
    width: 100%;
    aspect-ratio: 3.2 / 1;
    overflow: hidden;
    background:
      linear-gradient(135deg, rgba(26,125,104,0.55), rgba(21,112,130,0.42)),
      linear-gradient(180deg, #E8EEF4 0%, #F8FAFC 100%);
  }

  .headrow {
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 16px;
    margin-top: -44px;
  }
  .avatar-wrap {
    position: relative;
    border: 5px solid #FFFFFF;
    border-radius: 999px;
    width: 88px;
    height: 88px;
  }
  .avatar {
    width: 78px;
    height: 78px;
    border-radius: 999px;
    background:
      radial-gradient(circle at 35% 30%, #2C6E5C, #176A5A 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #E6FBF4;
    font-size: 29px;
    font-weight: 800;
  }
  .verified {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 22px;
    height: 22px;
    border-radius: 999px;
    background: #33A089;
    border: 2.5px solid #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 11px;
    font-weight: 800;
  }

  .actions {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
    padding-bottom: 4px;
  }
  /* Share — secondary round icon button (outline mint) */
  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 999px;
    border: 1.5px solid #33A089;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* meta */
  .meta { padding: 10px 16px 0 16px; }
  .name-row { display: flex; flex-direction: row; align-items: center; gap: 6px; }
  .name {
    font-size: 19px;
    font-weight: 800;
    color: #0F172A;
    letter-spacing: -0.2px;
  }
  .role {
    font-size: 13px;
    font-weight: 500;
    color: #475569;
    margin-top: 3px;
  }
  .bio {
    font-size: 13px;
    font-weight: 500;
    color: #475569;
    margin-top: 6px;
    line-height: 19px;
  }

  /* ── Vibesmood counter (NEW) ─────────────────────────────────────── */
  .vibesmood {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 9px;
    margin: 11px 16px 0 16px;
    padding: 9px 13px;
    border-radius: 16px;
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
  }
  .vm-icon {
    width: 30px;
    height: 30px;
    border-radius: 999px;
    background: rgba(51,160,137,0.10);
    border: 1px solid #33A089;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .vm-text { display: flex; flex-direction: column; }
  .vm-count {
    font-size: 15px;
    font-weight: 800;
    color: #33A089;
    font-variant-numeric: tabular-nums;
    line-height: 17px;
  }
  .vm-label {
    font-size: 12px;
    font-weight: 500;
    color: #475569;
    margin-top: 1px;
  }

  /* stats */
  .stats {
    display: flex;
    flex-direction: row;
    gap: 22px;
    padding: 12px 16px 2px 16px;
  }
  .stat-row {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    gap: 5px;
  }
  .stat-value {
    font-size: 15px;
    font-weight: 800;
    color: #0F172A;
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    font-size: 13px;
    font-weight: 500;
    color: #475569;
  }

  /* ── Sub-tab strip (TabBar pill-card WITH icons) ─────────────────── */
  .tabs-wrap { padding: 8px 8px 8px 8px; }
  .tabbar {
    display: flex;
    flex-direction: row;
    align-items: center;
    background: #F8FAFC;
    border-radius: 999px;
    padding: 4px;
    column-gap: 4px;
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border-radius: 999px;
    padding: 7px 0;
  }
  .tab-label {
    font-size: 11px;
    line-height: 13px;
    font-weight: 600;
    text-align: center;
    color: #475569;
    white-space: nowrap;
  }
  .tab.active {
    background: rgba(51,160,137,0.10);
    border: 1px solid #33A089;
  }
  .tab.active .tab-label { color: #33A089; }

  /* ── Active pane (Posts grid) ────────────────────────────────────── */
  .pane { padding-top: 2px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
  }
  .grid-cell {
    aspect-ratio: 1 / 1;
    position: relative;
    overflow: hidden;
  }
  .gc1 { background: linear-gradient(160deg, #D7E6EC, #176A5A); }
  .gc2 { background: linear-gradient(160deg, #E8EEF4, #1A7D68); }
  .gc3 { background: linear-gradient(200deg, #D7E6EC, #157082); }
  .gc4 { background: linear-gradient(140deg, #176A5A, #E8EEF4); }
  .gc5 { background: linear-gradient(160deg, #E8EEF4, #94A3B8); }
  .gc6 { background: linear-gradient(200deg, #1A7D68, #E8EEF4); }
  .cell-badge {
    position: absolute;
    top: 7px;
    right: 7px;
    opacity: 0.95;
  }

  /* ── BottomNav (canonical, light) ────────────────────────────────── */
  .bnav {
    flex: 0 0 auto;
    display: flex;
    flex-direction: row;
    justify-content: space-around;
    align-items: center;
    padding: 12px 24px 30px 24px;
    background: #FFFFFF;
    border-top-left-radius: 28px;
    border-top-right-radius: 28px;
    box-shadow: 0 -4px 24px rgba(15,23,42,0.06);
    border-top: 1px solid #E2E8F0;
  }
  .bnav-item {
    position: relative;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bnav-bar {
    position: absolute;
    bottom: -6px;
    width: 24px;
    height: 3px;
    border-radius: 999px;
    background: #33A089;
    box-shadow: 0 0 8px rgba(51,160,137,0.4);
  }
  .create-disc {
    width: 48px;
    height: 48px;
    border-radius: 999px;
    background: #F2FBF8;
    border: 1.5px solid #33A089;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 12px rgba(51,160,137,0.30);
  }
  .bnav-avatar-wrap {
    width: 36px;
    height: 36px;
    border-radius: 14px;
    border: 2px solid #33A089;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 8px rgba(51,160,137,0.35);
  }
  .bnav-avatar {
    width: 32px;
    height: 32px;
    border-radius: 12px;
    background: radial-gradient(circle at 35% 30%, #2C6E5C, #176A5A 70%);
  }
</style>
</head>
