<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=393, initial-scale=1" />
<title>blocked_users_v2 — dark</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  html, body { background: #05070f; }
  body {
    display: flex; align-items: flex-start; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .device {
    width: 393px; height: 852px; overflow: hidden; position: relative;
    background: #0A0E1A; color: #FFFFFF; display: flex; flex-direction: column;
  }

  /* ---- G1 SAFE-AREA: faux iOS status bar (54px top inset) ---- */
  .statusbar {
    height: 54px; flex: none; padding: 0 24px 0 30px;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding-bottom: 8px;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; color: #FFFFFF; }
  .statusbar .glyphs { display: flex; align-items: center; gap: 6px; }
  .statusbar .glyphs svg { display: block; }

  /* ---- SUB-SCREEN header: back chevron in circle + center title ---- */
  .topbar {
    flex: none; position: relative; display: flex; align-items: center; justify-content: center;
    padding: 4px 14px 12px 14px;
    border-bottom: 0.5px solid #2A3142;
  }
  .backBtn {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #161B2A; border: 1px solid #2A3142;
  }
  .backBtn svg { display: block; }
  .topbarTitle {
    font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: #FFFFFF;
  }

  /* ---- body (list) ---- */
  .body { flex: 1; overflow: hidden; }
  .list { padding: 0 20px 24px 20px; }

  /* ---- editorial hero ---- */
  .hero { padding: 20px 4px 14px 4px; }
  .superLabel {
    font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    color: #33A089; margin-bottom: 8px;
  }
  .h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.8px; line-height: 34px; color: #FFFFFF; }
  .count { font-size: 15px; font-weight: 500; margin-top: 8px; color: #94A3B8; }

  /* ---- card chrome (single rounded surface) ---- */
  .card { border-radius: 20px; overflow: hidden; }

  /* ---- row ---- */
  .row {
    display: flex; flex-direction: row; align-items: center; justify-content: space-between;
    gap: 12px; padding: 13px 14px;
    background: #161B2A;
    border-left: 0.5px solid #2A3142;
    border-right: 0.5px solid #2A3142;
    border-bottom: 0.5px solid #2A3142;
  }
  .row.first { border-top: 0.5px solid #2A3142; border-top-left-radius: 20px; border-top-right-radius: 20px; }
  .row.last { border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }

  .rowInfo { flex: 1; display: flex; flex-direction: row; align-items: center; gap: 14px; min-height: 46px; min-width: 0; }
  .avatar {
    width: 50px; height: 50px; border-radius: 16px; flex: none;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: #33A089;
  }
  .avatarInitials { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; color: #03100C; }
  .rowText { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .rowName {
    font-size: 16px; font-weight: 700; letter-spacing: -0.2px; color: #FFFFFF;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rowDate { font-size: 13.5px; font-weight: 500; color: #94A3B8; white-space: nowrap; }

  /* ---- danger-tinted unblock pill ---- */
  .unblockPill {
    flex: none; min-width: 104px; min-height: 38px; padding: 0 18px; border-radius: 19px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(248, 113, 113, 0.12);
  }
  .unblockPillText { font-size: 14.5px; font-weight: 700; letter-spacing: -0.1px; color: #F87171; }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(248,113,113,0.25); border-top-color: #F87171;
  }
</style>
</head>
<body>

  </div>
</body>
</html>
