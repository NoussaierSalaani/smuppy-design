<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>muted_users_v2 — dark</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    width: 393px; height: 852px; overflow: hidden;
    background: #0A0E1A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #FFFFFF;
  }
  .device { width: 393px; height: 852px; position: relative; display: flex; flex-direction: column; background: #0A0E1A; overflow: hidden; }

  /* ── G1 SAFE-AREA : faux iOS status bar (54px top inset) ── */
  .statusbar {
    height: 54px; padding: 0 24px 6px 30px;
    display: flex; align-items: flex-end; justify-content: space-between;
    flex-shrink: 0;
  }
  .sb-time { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; color: #FFFFFF; }
  .sb-glyphs { display: flex; align-items: center; gap: 7px; }
  .sb-glyphs svg { display: block; }

  /* ── SUB-SCREEN header : back chevron in circle + center title ── */
  .topbar {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 4px 16px 14px 16px;
    border-bottom: 0.5px solid #2A3142;
    flex-shrink: 0;
  }
  .back-btn {
    position: absolute; left: 12px;
    width: 38px; height: 38px; border-radius: 19px;
    border: 1px solid #2A3142; background: #161B2A;
    display: flex; align-items: center; justify-content: center;
  }
  .back-btn svg { display: block; }
  .topbar-title {
    font-size: 18px; font-weight: 800; letter-spacing: -0.3px; color: #FFFFFF;
  }

  /* ── G3 Body (no scroll, content fits one screen) ── */
  .body { flex: 1; overflow: hidden; padding: 0 20px 24px 20px; }

  /* ── Editorial hero ── */
  .hero { padding: 22px 4px 16px 4px; }
  .super-label {
    font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: #33A089; margin-bottom: 8px;
  }
  .h1 {
    font-size: 30px; font-weight: 800; letter-spacing: -0.8px;
    line-height: 36px; color: #FFFFFF;
  }
  .count {
    font-size: 15px; font-weight: 500; margin-top: 8px; color: #94A3B8;
  }

  /* ── Card ── */
  .card {
    border-radius: 20px;
    border: 1px solid #2A3142;
    background: #161B2A;
    overflow: hidden;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px; gap: 12px;
    border-bottom: 0.5px solid #2A3142;
  }
  .row:last-child { border-bottom: none; }

  .row-info { flex: 1; display: flex; align-items: center; gap: 14px; min-height: 48px; }
  .avatar {
    width: 52px; height: 52px; border-radius: 16px;
    background: #33A089;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
  }
  .avatar-initials { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; color: #06251F; }
  .row-text { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .row-name {
    font-size: 16px; font-weight: 700; letter-spacing: -0.2px; color: #FFFFFF;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-status { font-size: 13.5px; font-weight: 500; color: #94A3B8; }

  /* ── G7 "Réactiver" chip : mint text + mint contour, transparent bg ── */
  .unmute-pill {
    min-width: 104px; min-height: 38px;
    padding: 0 18px; border-radius: 19px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(51, 160, 137, 0.10);
    border: 1px solid #33A089;
    flex-shrink: 0;
  }
  .unmute-pill-text {
    font-size: 14.5px; font-weight: 700; letter-spacing: -0.1px;
    color: #33A089; white-space: nowrap;
  }

  /* Decorative avatar gradient fill (stands in for cdn photo) */
  .avatar-photo-a { background: linear-gradient(135deg, #2D6E63, #1A4A42); }
  .avatar-photo-b { background: linear-gradient(135deg, #3B5170, #233047); }
</style>
</head>
<body>
<div class="device">

  <!-- G1 SAFE-AREA status bar -->
  <div class="statusbar">
    <div class="sb-time">9:41</div>
    <div class="sb-glyphs">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
        <rect x="0"  y="7" width="3" height="5"  rx="1" fill="#FFFFFF"/>
        <rect x="5"  y="5" width="3" height="7"  rx="1" fill="#FFFFFF"/>
        <rect x="10" y="3" width="3" height="9"  rx="1" fill="#FFFFFF"/>
        <rect x="15" y="0" width="3" height="12" rx="1" fill="#FFFFFF"/>
      </svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
        <path d="M8.5 2.2c2.7 0 5.2 1 7 2.8l-1.5 1.6A7.7 7.7 0 0 0 8.5 4.3 7.7 7.7 0 0 0 3 6.6L1.5 5C3.3 3.2 5.8 2.2 8.5 2.2Z" fill="#FFFFFF"/>
        <path d="M8.5 6c1.5 0 2.9.6 3.9 1.6l-1.6 1.6a3.3 3.3 0 0 0-4.6 0L4.6 7.6C5.6 6.6 7 6 8.5 6Z" fill="#FFFFFF"/>
        <circle cx="8.5" cy="10.5" r="1.4" fill="#FFFFFF"/>
      </svg>
      <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
        <rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="#FFFFFF" stroke-opacity="0.4"/>
        <rect x="2" y="2" width="18" height="8" rx="1.6" fill="#FFFFFF"/>
        <rect x="24" y="4" width="1.6" height="4" rx="0.8" fill="#FFFFFF" fill-opacity="0.5"/>
      </svg>
    </div>
  </div>

  <!-- SUB-SCREEN header -->
  <div class="topbar">
    <div class="back-btn">
      <svg width="11" height="18" viewBox="0 0 11 18" fill="none">
        <path d="M9 1 1.5 9 9 17" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="topbar-title">Sourdine</div>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Editorial hero -->
    <div class="hero">
      <div class="super-label">CONFIDENTIALITÉ</div>
      <div class="h1">Comptes en sourdine</div>
      <div class="count">3 comptes masqués</div>
    </div>

    <!-- Muted users card -->
    <div class="card">

      <div class="row">
        <div class="row-info">
          <div class="avatar avatar-photo-a"></div>
          <div class="row-text">
            <div class="row-name">@a.legrand</div>
            <div class="row-status">En sourdine</div>
          </div>
        </div>
        <div class="unmute-pill"><span class="unmute-pill-text">Réactiver</span></div>
      </div>

      <div class="row">
        <div class="row-info">
          <div class="avatar"><span class="avatar-initials">NB</span></div>
          <div class="row-text">
            <div class="row-name">@nadia.b</div>
            <div class="row-status">En sourdine</div>
          </div>
        </div>
        <div class="unmute-pill"><span class="unmute-pill-text">Réactiver</span></div>
      </div>

      <div class="row">
        <div class="row-info">
          <div class="avatar avatar-photo-b"></div>
          <div class="row-text">
            <div class="row-name">@aicha.d</div>
            <div class="row-status">En sourdine</div>
          </div>
        </div>
        <div class="unmute-pill"><span class="unmute-pill-text">Réactiver</span></div>
      </div>

    </div>

  </div>

</div>
</body>
</html>
