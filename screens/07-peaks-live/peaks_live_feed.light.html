<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=393, initial-scale=1" />
<title>peaks_live_feed_v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 393px; height: 852px; overflow: hidden;
    background: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0F172A;
  }
  .screen { width: 393px; height: 852px; background: #FFFFFF; display: flex; flex-direction: column; position: relative; }

  /* ---- faux iOS status bar ---- */
  .statusbar {
    height: 54px; display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 22px 8px; font-size: 15px; font-weight: 600; color: #0F172A;
  }
  .statusbar .glyphs { display: flex; align-items: center; gap: 6px; font-size: 13px; }

  /* ---- G6 feed header: search · wordmark · bell ---- */
  .header { display: flex; flex-direction: row; align-items: center; padding: 6px 16px 4px; }
  .header-side { width: 40px; height: 40px; display: flex; align-items: center; }
  .header-side.right { justify-content: flex-end; position: relative; }
  .wordmark { flex: 1; text-align: center; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: #0F172A; }
  .bell-badge { position: absolute; top: 4px; right: 2px; width: 8px; height: 8px; border-radius: 4px; background: #DC2626; border: 1.5px solid #FFFFFF; }

  /* ---- segmented sub-tabs: TEXT + 1px contour, active = mint text + mint contour (NO solid fill) ---- */
  .subtabs-wrap { display: flex; justify-content: center; padding: 6px 16px 4px; }
  .subtabs { display: flex; flex-direction: row; gap: 8px; }
  .subtab {
    padding: 8px 20px; border-radius: 999px; font-size: 15px; font-weight: 700;
    border: 1px solid #E2E8F0; background: transparent; color: #475569;
  }
  .subtab.active {
    color: #33A089; border-color: #33A089; background: rgba(51,160,137,0.08);
  }

  /* ---- G7 category filter chips: mint text + mint contour, transparent / subtle tint when selected ---- */
  .chips {
    display: flex; flex-direction: row; gap: 8px;
    padding: 6px 16px 8px; overflow-x: hidden; white-space: nowrap;
  }
  .chip {
    height: 36px; padding: 0 16px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; border: 1px solid #E2E8F0;
    flex: 0 0 auto; background: transparent; color: #475569;
  }
  .chip.on { background: rgba(51,160,137,0.10); border-color: #33A089; color: #33A089; }

  /* ---- 2-col grid ---- */
  .grid {
    flex: 1; overflow: hidden;
    padding: 0 14px 100px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; flex-direction: row; justify-content: space-between; }
  .cell { width: 48.5%; position: relative; }

  /* PeakLiveCard: aspectRatio 7/10, radius 28 */
  .card {
    width: 100%; aspect-ratio: 7 / 10; border-radius: 28px; overflow: hidden;
    background: #F8FAFC; position: relative; display: block;
  }
  .card .img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 55%, rgba(0,0,0,0.7) 100%);
  }
  .play-pill {
    position: absolute; top: 10px; left: 10px;
    display: flex; flex-direction: row; align-items: center; gap: 3px;
    padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,0.45);
  }
  .play-glyph { color: #fff; font-size: 9px; }
  .play-text { color: #fff; font-size: 11px; font-weight: 700; }
  .card .name {
    position: absolute; left: 11px; right: 11px; bottom: 10px;
    color: #fff; font-size: 12px; font-weight: 700;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---- G5 bottom nav ---- */
  .bottomnav-wrap { width: 100%; position: absolute; left: 0; bottom: 0; padding: 0 0 26px; }
  .bottomnav {
    margin: 0 16px; height: 62px; background: #F8FAFC;
    border: 1px solid #E2E8F0; border-radius: 28px;
    display: flex; flex-direction: row; align-items: center; justify-content: space-around;
    box-shadow: 0 8px 24px rgba(15,23,42,0.10);
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #94A3B8; }
  .nav-item.active { color: #33A089; }
  .nav-lbl { font-size: 10px; font-weight: 600; }
</style>
</head>
