<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=393, initial-scale=1" />
<title>peak_viewer_v2 — dark</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 393px; height: 852px; overflow: hidden;
    background: #0A0E1A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .stage {
    position: relative;
    width: 393px; height: 852px;
    background: #0A0E1A;
    overflow: hidden;
  }

  /* faux video full-bleed — a vertical fitness gradient stands in for the peak clip */
  .video {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(51,160,137,0.30), transparent 55%),
      linear-gradient(180deg, #14323a 0%, #0d1d2a 38%, #0A0E1A 100%);
  }
  .video::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 40% at 30% 72%, rgba(255,255,255,0.06), transparent 60%),
      radial-gradient(40% 30% at 78% 30%, rgba(96,165,250,0.10), transparent 60%);
  }
  .scrim {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.6);
    pointer-events: none;
  }

  .shadow { text-shadow: 0 1px 4px rgba(0,0,0,0.85); }

  /* ── iOS status bar (faux) ── */
  .statusbar {
    position: absolute; top: 0; left: 0; right: 0; height: 54px;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 0 22px 8px; z-index: 50;
    color: #FFFFFF; font-size: 15px; font-weight: 700;
  }
  .statusbar .glyphs { display: flex; align-items: center; gap: 6px; }

  /* ── SUB-SCREEN header (below 54px safe-area): back chevron in circle + title ── */
  .header {
    position: absolute; top: 54px; left: 0; right: 0; height: 56px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px; z-index: 45;
  }
  .backBtn {
    width: 40px; height: 40px; border-radius: 999px;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .headerTitle {
    color: #FFFFFF; font-size: 17px; font-weight: 800;
  }

  /* ── challenge badge (top-left, below header) ── */
  .challenge {
    position: absolute; top: 118px; left: 16px;
    padding: 4px 9px; border-radius: 8px;
    background: #176A5A; z-index: 40;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .challenge span {
    color: #FFFFFF; font-size: 11px; font-weight: 800; letter-spacing: 0.6px;
  }

  /* ── right rail ── */
  .rail {
    position: absolute; right: 12px; bottom: 132px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    z-index: 30;
  }
  .railBtn {
    min-width: 44px; min-height: 44px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .railCount { color: #FFFFFF; font-size: 12px; font-weight: 700; }

  /* ── bottom-left overlay ── */
  .bottom {
    position: absolute; left: 16px; right: 80px; bottom: 28px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 30;
  }
  .author {
    display: flex; flex-direction: row; align-items: center; gap: 10px; min-height: 44px;
  }
  .authorAvatar {
    width: 40px; height: 40px; border-radius: 12px; overflow: hidden; flex-shrink: 0;
    background: linear-gradient(135deg, #176A5A, #33A089);
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF; font-size: 16px; font-weight: 800;
  }
  .authorName { color: #FFFFFF; font-size: 15px; font-weight: 800; flex-shrink: 1; }
  .caption {
    color: rgba(255,255,255,0.92); font-size: 14px; font-weight: 500; line-height: 19px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sound {
    display: inline-flex; flex-direction: row; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 999px; background: rgba(0,0,0,0.5);
    align-self: flex-start; max-width: 100%;
  }
  .soundText {
    color: #FFFFFF; font-size: 12px; font-weight: 600; flex-shrink: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ── progress bar ── */
  .progressTrack {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: rgba(255,255,255,0.22); z-index: 40;
  }
  .progressFill { height: 100%; width: 42%; background: #33A089; }
</style>
</head>
<body>
  <div class="stage">
    <!-- caller-owned video slot (full-bleed) -->
    <div class="video"></div>
    <div class="scrim"></div>

    <!-- iOS status bar -->
    <div class="statusbar shadow">
      <span>9:41</span>
      <span class="glyphs">
        <!-- signal -->
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="8" width="3" height="4" rx="1" fill="#FFFFFF"/><rect x="5" y="5" width="3" height="7" rx="1" fill="#FFFFFF"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#FFFFFF"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#FFFFFF"/></svg>
        <!-- battery -->
        <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3" stroke="#FFFFFF" opacity="0.7"/><rect x="2" y="2" width="18" height="9" rx="1.5" fill="#FFFFFF"/><rect x="24" y="4" width="2" height="5" rx="1" fill="#FFFFFF" opacity="0.7"/></svg>
      </span>
    </div>

    <!-- SUB-SCREEN header: back chevron in circle + title -->
    <div class="header">
      <div class="backBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12l7 7" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="headerTitle shadow">Peak</span>
    </div>

    <!-- challenge badge -->
    <div class="challenge">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.6 6.3 6.8.5-5.2 4.4 1.7 6.6L12 16.9 6.3 20.3l1.7-6.6L2.8 9.3l6.8-.5L12 2z" fill="#FFFFFF"/></svg>
      <span>CHALLENGE</span>
    </div>

    <!-- right rail: Like / Save / Share / Menu / Mute (NO comment) -->
    <div class="rail">
      <div class="railBtn">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.6-10-9.3C.6 9 1.8 5.6 5 5.1c2-.3 3.6.8 4.6 2.2C10.6 5.9 12.2 4.8 14.2 5.1c3.2.5 4.4 3.9 3 6.6C19.5 16.4 12 21 12 21z" fill="#FF4D5E"/></svg>
        <span class="railCount shadow">1,2k</span>
      </div>
      <div class="railBtn">
        <svg width="29" height="29" viewBox="0 0 24 24" fill="none"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.6 6.6 19.9l1-6.1L3.2 9.5l6.1-.9L12 3z" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
      </div>
      <div class="railBtn">
        <svg width="29" height="29" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-7-5 16-3.2-6.4L4 12z" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" fill="none"/></svg>
      </div>
      <div class="railBtn">
        <svg width="29" height="29" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.9" fill="#FFFFFF"/><circle cx="12" cy="12" r="1.9" fill="#FFFFFF"/><circle cx="19" cy="12" r="1.9" fill="#FFFFFF"/></svg>
      </div>
      <!-- volume / mute — flat SVG icon (corrected, no emoji) -->
      <div class="railBtn">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#FFFFFF"/><path d="M16.5 8.5a5 5 0 010 7" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/><path d="M19 6a8.5 8.5 0 010 12" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </div>
    </div>

    <!-- bottom-left author overlay -->
    <div class="bottom">
      <div class="author">
        <div class="authorAvatar">L</div>
        <span class="authorName shadow">Coach Lina</span>
      </div>
      <div class="caption shadow">S&eacute;ance du matin &mdash; on garde le rythme toute la semaine, qui me suit ?</div>
      <div class="sound">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M9 18V6l10-2v10" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="6.5" cy="18" r="2.5" stroke="#FFFFFF" stroke-width="1.8" fill="none"/><circle cx="16.5" cy="16" r="2.5" stroke="#FFFFFF" stroke-width="1.8" fill="none"/></svg>
        <span class="soundText shadow">Smuppy Sound &mdash; Lina B.</span>
      </div>
    </div>

    <!-- bottom progress bar -->
    <div class="progressTrack">
      <div class="progressFill"></div>
    </div>
  </div>
</body>
</html>
