<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Smuppy V2 — Go Live (Light)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root {
    --mint:#33A089;
    --surface:#FFFFFF; --container:#F8FAFC;
    --text:#0F172A; --variant:#475569; --outline:#E2E8F0;
  }
  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html, body { background:var(--surface); }
  body {
    width:393px; height:852px; overflow:hidden; position:relative;
    background:var(--surface); color:var(--text);
    font-family:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;
    font-size:15px; line-height:1.5;
  }

  /* ── Faux iOS status bar ───────────────────────────────────── */
  .statusbar { position:absolute; top:0; left:0; right:0; height:54px; z-index:30;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 22px 8px; pointer-events:none; }
  .statusbar-time { font-size:15px; font-weight:700; color:var(--text); letter-spacing:.02em; }
  .statusbar-icons { display:flex; align-items:center; gap:6px; }

  /* ── Sub-screen header (back chevron in circle + centered title) ─ */
  .header { position:absolute; top:54px; left:0; right:0; z-index:20;
    height:52px; padding:0 14px;
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border-bottom:1px solid var(--outline); }
  .back-btn { width:38px; height:38px; border-radius:999px;
    background:var(--container); border:1px solid var(--outline);
    display:flex; align-items:center; justify-content:center;
    color:var(--text); flex-shrink:0; }
  .header-title { flex:1; text-align:center; font-size:16px; font-weight:800;
    color:var(--text); letter-spacing:-.01em; }
  .header-spacer { width:38px; flex-shrink:0; }

  /* ── Content ───────────────────────────────────────────────── */
  .content { position:absolute; top:106px; left:0; right:0; bottom:0;
    padding:18px 18px 24px; display:flex; flex-direction:column; }

  .screen-title { font-size:24px; font-weight:800; letter-spacing:-.02em;
    color:var(--text); margin:0 0 4px; }
  .screen-sub { font-size:13.5px; font-weight:500; color:var(--variant);
    margin:0 0 18px; line-height:1.4; }

  /* ── Input ─────────────────────────────────────────────────── */
  .input-label { display:block; margin-bottom:18px; }
  .input-lbl-txt { display:block; font-size:11px; font-weight:700;
    color:var(--variant); margin:0 0 6px 4px;
    text-transform:uppercase; letter-spacing:.08em; }
  .input { position:relative; display:flex; align-items:center;
    height:50px; padding:0 16px 0 42px; border-radius:14px;
    background:var(--container); border:1.5px solid var(--outline); }
  .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color:var(--variant); display:flex; }
  .input-value { color:var(--text); font-size:15px; font-weight:500; }

  /* ── Section title ─────────────────────────────────────────── */
  .sec-title { font-size:11px; font-weight:800; color:var(--variant);
    margin:0 0 8px 4px; text-transform:uppercase; letter-spacing:.10em; }

  /* ── Access cards ──────────────────────────────────────────── */
  .access-cards { display:flex; flex-direction:column; gap:8px; margin:0 0 14px; }
  .access { display:flex; align-items:center; gap:14px;
    padding:14px 14px; border-radius:16px;
    background:var(--container); border:1.5px solid var(--outline);
    text-align:left; color:var(--text); cursor:pointer; }
  .access-on { border-color:var(--mint); background:rgba(51,160,137,.08); }
  .access-body { flex:1; }
  .access-title { font-size:13.5px; font-weight:800; color:var(--text); }
  .access-sub { font-size:11.5px; font-weight:600; color:var(--variant); margin-top:2px; }
  .access-ic { display:flex; flex-shrink:0; }

  /* ── Gradient CTA ──────────────────────────────────────────── */
  .cta-primary { display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; height:54px; border:none; border-radius:999px;
    background:linear-gradient(135deg,#1A7D68,#157082);
    color:#FFFFFF; font-family:inherit; font-size:15px; font-weight:800;
    cursor:pointer; letter-spacing:.01em;
    box-shadow:0 8px 24px rgba(26,125,104,.30); }
  .cta-spacer { flex:1; }
  .live-dot { width:9px; height:9px; border-radius:999px; background:#FF4658;
    box-shadow:0 0 8px rgba(255,70,88,.7); }
</style>
</head><body>

<!-- G1 SAFE-AREA faux iOS status bar -->
<div class="statusbar">
  <span class="statusbar-time">9:41</span>
  <span class="statusbar-icons">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#0F172A"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#0F172A"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#0F172A"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#0F172A"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.5c2.3 0 4.4.9 6 2.4l-1.4 1.4A6.6 6.6 0 008.5 4.4 6.6 6.6 0 003.9 6.3L2.5 4.9A8.6 8.6 0 018.5 2.5z" fill="#0F172A"/><circle cx="8.5" cy="9.5" r="1.6" fill="#0F172A"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#0F172A" opacity="0.5"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#0F172A"/><rect x="23" y="4" width="1.5" height="4" rx="0.7" fill="#0F172A" opacity="0.6"/></svg>
  </span>
</div>

<!-- SUB-SCREEN header: back chevron in circle + centered title (below safe-area) -->
<header class="header">
  <button class="back-btn" aria-label="Retour">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="header-title">Go Live</span>
  <span class="header-spacer"></span>
</header>

<main class="content">
  <h1 class="screen-title">Configure ton live</h1>
  <p class="screen-sub">Vérifie tout avant de démarrer</p>

  <label class="input-label">
    <span class="input-lbl-txt">Titre du live</span>
    <div class="input">
      <span class="input-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </span>
      <span class="input-value">Sunrise yoga · Plateau MTL</span>
    </div>
  </label>

  <h3 class="sec-title">Accès</h3>
  <div class="access-cards">
    <button class="access access-on">
      <span class="access-ic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#33A089" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      </span>
      <div class="access-body">
        <div class="access-title">Public · gratuit</div>
        <div class="access-sub">Tout le monde peut rejoindre</div>
      </div>
      <span class="access-ic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#33A089" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="#33A089" stroke="none"/></svg>
      </span>
    </button>
    <button class="access">
      <span class="access-ic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9966FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </span>
      <div class="access-body">
        <div class="access-title">Abonnés de la chaîne</div>
        <div class="access-sub">$9.99/mois · 412 fans actifs</div>
      </div>
      <span class="access-ic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
      </span>
    </button>
    <button class="access">
      <span class="access-ic">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E08A2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </span>
      <div class="access-body">
        <div class="access-title">Pay-per-view · $4.99</div>
        <div class="access-sub">Stripe Connect requis</div>
      </div>
      <span class="access-ic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
      </span>
    </button>
  </div>

  <span class="cta-spacer"></span>

  <button class="cta-primary">
    <span>Démarrer le live</span>
    <span class="live-dot"></span>
    <span>LIVE</span>
  </button>
</main>

</body></html>
