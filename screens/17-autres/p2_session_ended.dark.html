<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Smuppy V2 — Session terminée (dark)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
</head>
<body style="margin:0;display:flex;align-items:center;justify-content:center;background:#05070C;font-family:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;">
<div style="position:relative;width:393px;height:852px;overflow:hidden;background:#0A0E1A;color:#FFFFFF;">

  <!-- faux iOS status bar -->
  <div style="position:absolute;top:0;left:0;right:0;height:54px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:14px 22px 0;font-size:14px;font-weight:700;color:#FFFFFF;">
    <span>9:41</span>
    <span style="display:flex;align-items:center;gap:6px;">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="#FFFFFF"/><rect x="5" y="4" width="3" height="8" rx="1" fill="#FFFFFF"/><rect x="10" y="2" width="3" height="10" rx="1" fill="#FFFFFF"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#FFFFFF"/></svg>
      <svg width="22" height="12" viewBox="0 0 22 12" fill="none"><rect x="0.5" y="0.5" width="18" height="11" rx="3" stroke="#FFFFFF" opacity="0.5"/><rect x="2" y="2" width="14" height="8" rx="1.5" fill="#FFFFFF"/><rect x="20" y="4" width="2" height="4" rx="1" fill="#FFFFFF" opacity="0.5"/></svg>
    </span>
  </div>

  <!-- SUB-SCREEN header: back chevron in circle + centered title, below 54px safe-area -->
  <div style="position:absolute;top:54px;left:0;right:0;height:52px;z-index:20;display:flex;align-items:center;padding:0 14px;">
    <button style="width:40px;height:40px;border:1px solid #2A3142;background:#161B2A;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 style="flex:1;text-align:center;font-size:16px;font-weight:800;margin:0;color:#FFFFFF;letter-spacing:-.01em;">Récap session</h1>
    <div style="width:40px;flex-shrink:0;"></div>
  </div>

  <!-- content: starts below header, compact, no scroll -->
  <div style="position:absolute;top:106px;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding:8px 24px 22px;">

    <!-- success check -->
    <div style="position:relative;width:92px;height:92px;border-radius:999px;background:rgba(51,160,137,.12);display:flex;align-items:center;justify-content:center;margin:6px 0 16px;box-shadow:0 0 40px rgba(51,160,137,.30),0 0 0 2px rgba(51,160,137,.30) inset;">
      <div style="position:absolute;inset:-10px;border-radius:999px;border:2px solid rgba(51,160,137,.30);"></div>
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17L4 12" stroke="#33A089" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <h2 style="font-size:24px;font-weight:900;margin:0 0 6px;color:#FFFFFF;letter-spacing:-.02em;text-align:center;">Session terminée !</h2>
    <p style="font-size:13.5px;font-weight:500;color:#94A3B8;text-align:center;margin:0 0 18px;line-height:1.45;">60 min avec Sara Khan · Yoga vinyasa</p>

    <!-- stats card -->
    <div style="display:flex;align-items:center;gap:14px;width:100%;max-width:320px;padding:14px 18px;border-radius:18px;background:#161B2A;border:1px solid #2A3142;margin:0 0 18px;">
      <div style="display:flex;flex-direction:column;align-items:center;flex:1;">
        <div style="font-size:22px;font-weight:900;color:#33A089;letter-spacing:-.02em;">60</div>
        <div style="font-size:10.5px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.06em;margin-top:3px;">min</div>
      </div>
      <div style="width:1px;height:32px;background:#2A3142;"></div>
      <div style="display:flex;flex-direction:column;align-items:center;flex:1;">
        <div style="font-size:22px;font-weight:900;color:#33A089;letter-spacing:-.02em;">HD</div>
        <div style="font-size:10.5px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.06em;margin-top:3px;">Qualité</div>
      </div>
    </div>

    <!-- rating -->
    <h3 style="font-size:12px;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;">Note ta session</h3>
    <div style="display:flex;gap:6px;margin:0 0 18px;">
      <span style="font-size:30px;line-height:1;color:#FFA63D;filter:drop-shadow(0 0 6px rgba(255,166,61,.50));">★</span>
      <span style="font-size:30px;line-height:1;color:#FFA63D;filter:drop-shadow(0 0 6px rgba(255,166,61,.50));">★</span>
      <span style="font-size:30px;line-height:1;color:#FFA63D;filter:drop-shadow(0 0 6px rgba(255,166,61,.50));">★</span>
      <span style="font-size:30px;line-height:1;color:#FFA63D;filter:drop-shadow(0 0 6px rgba(255,166,61,.50));">★</span>
      <span style="font-size:30px;line-height:1;color:#FFA63D;filter:drop-shadow(0 0 6px rgba(255,166,61,.50));">★</span>
    </div>

    <!-- CORRECTION: tip phrase + "Donner des Smups" CTA -->
    <p style="font-size:12.5px;font-weight:500;color:#94A3B8;text-align:center;margin:0 0 12px;line-height:1.45;max-width:300px;">Tu as adoré ? Soutiens Sara Khan en lui envoyant des Smups.</p>

    <div style="display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px;margin-top:auto;">
      <!-- gradient CTA, white ink -->
      <button style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:none;border-radius:999px;background:linear-gradient(135deg,#1A7D68,#157082);color:#FFFFFF;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.01em;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 7 8 7 13a5 5 0 0 0 10 0c0-5-5-11-5-11Z" fill="#FFFFFF"/><circle cx="12" cy="13.5" r="2.4" fill="#157082"/></svg>
        Donner des Smups
      </button>
      <!-- secondary outline CTA -->
      <button style="display:flex;align-items:center;justify-content:center;width:100%;height:50px;border:1.5px solid #2A3142;border-radius:999px;background:transparent;color:#FFFFFF;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;">Réserver à nouveau</button>
      <!-- text link -->
      <button style="border:none;background:transparent;cursor:pointer;color:#94A3B8;font-family:inherit;font-size:13px;font-weight:700;padding:8px 0;">Terminé</button>
    </div>

  </div>
</div>
</body></html>
