<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RunRecordsView — V2 Dark</title>
<style>
  /* ── V2 DARK tokens (src/theme/v2/tokens.ts, dark mode) ── */
  :root {
    --surface: #0A0E1A;
    --surfaceContainer: #161B2A;
    --surfaceContainerHigh: #1E2435;
    --onSurface: #FFFFFF;
    --onSurfaceVariant: #94A3B8;       /* slate[400] */
    --outline: #2A3142;
    --outlineVariant: #1F2538;
    --primary: #5BB8A6;                /* mint.inverse — dark primary (CTA solid bg, accent ink) */
    --primaryAccent: #33A089;          /* mint.solid — record-row icon tint */
    --onPrimary: #00231D;              /* ink on solid mint */
    --gradStart: #1A7D68;
    --gradEnd: #157082;
    --gradInk: #FFFFFF;
    --danger: #F87171;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #05070D;
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 32px 0;
  }

  /* ── Device frame 393×852 (iPhone 14 Pro logical) ── */
  .device {
    width: 393px;
    height: 852px;
    background: var(--surface);          /* styles.fill backgroundColor: t.colors.surface */
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 10px #0d1018, 0 24px 70px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
  }

  /* ── faux iOS status bar inside a 54px TOP SAFE-AREA inset ── */
  .statusbar {
    height: 54px;
    flex: 0 0 54px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 26px 8px;
    color: var(--onSurface);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.2px;
  }
  .statusbar .right { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { display: block; }

  /* ── Header: styles.header (row, paddingH 12, paddingTop 8, paddingBottom 6) ── */
  .header {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 8px 12px 6px;
  }
  /* ghost Button size sm — back glyph '‹' */
  .back-btn {
    height: 36px;                /* sizing.control.sm */
    min-width: 36px;
    padding: 0 12px;             /* spacing.md horizontal for sm */
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;     /* ghost */
    border: 0;
    border-radius: 12px;         /* radius.md */
  }
  .back-glyph {
    color: var(--primary);       /* ghost textColor = primary */
    font-size: 26px;
    line-height: 1;
    font-weight: 600;
    margin-top: -3px;
  }
  .header-title {
    flex: 1;
    text-align: center;
    font-size: 18px;
    font-weight: 800;            /* extrabold */
    color: var(--onSurface);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-spacer { width: 56px; }   /* styles.headerSpacer */

  /* ── Segmented tabs: styles.tabs ── */
  .tabs {
    display: flex;
    flex-direction: row;
    margin: 4px 16px 12px;
    padding: 4px;
    border-radius: 999px;        /* radius.pill */
    border: 0.5px solid var(--outline);  /* hairline */
    background: var(--surfaceContainer);
    gap: 4px;
  }
  .tab {
    flex: 1;
    height: 36px;                /* control.sm */
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;         /* Button radius.md (solid/ghost) */
    font-size: 12px;             /* label-md */
    line-height: 17px;
    letter-spacing: 0.24px;
    font-weight: 600;            /* semibold */
    border: 0;
    cursor: default;
  }
  .tab.on {
    background: var(--primary);  /* solid */
    color: var(--onPrimary);
  }
  .tab.off {
    background: transparent;     /* ghost */
    color: var(--primary);
  }

  /* ── ScrollView content: styles.scroll (paddingH 16, paddingBottom 40) ── */
  .scroll {
    flex: 1;
    overflow: hidden;
    padding: 0 16px 40px;
  }

  /* ── Section titles: styles.sectionTitle (fontSize 15, weight 800, mb 12) ── */
  .section-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--onSurface);
    margin-bottom: 12px;
  }
  .section-title.spaced { margin-top: 22px; }   /* sectionTitleSpaced */

  /* ── Summary grid: styles.grid ── */
  .grid {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: space-between;
  }
  /* gridCell: width 48.5% mb 10 ; Card outlined padding lg(16) radius 2xl(28) */
  .grid-cell {
    width: 48.5%;
    margin-bottom: 10px;
    padding: 16px;
    border-radius: 28px;
    background: var(--surface);              /* outlined bg = surface */
    border: 1px solid var(--outlineVariant); /* outlined border */
    overflow: hidden;
  }

  /* ── StatTile size lg, tone accent, align left ── */
  .tile { display: flex; flex-direction: column; align-items: flex-start; }
  .tile-value-row { display: flex; flex-direction: row; align-items: baseline; }
  .tile-value {
    font-size: 30px;               /* lg */
    letter-spacing: -0.6px;
    font-weight: 800;              /* extrabold */
    color: var(--primary);         /* tone accent -> primary (mint) */
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .tile-unit {
    margin-left: 3px;
    font-size: 15px;               /* lg unit */
    font-weight: 600;              /* semibold */
    color: var(--onSurfaceVariant);
    font-variant-numeric: tabular-nums;
  }
  .tile-label-row { display: flex; flex-direction: row; align-items: center; margin-top: 3px; }
  .tile-label {
    font-size: 12px;               /* label-caps */
    line-height: 17px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    font-weight: 700;              /* bold */
    color: var(--onSurfaceVariant);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  /* ── Record list Card: outlined, padding lg(16) but paddingVertical 0 (listCard) ── */
  .list-card {
    padding: 0 16px;
    border-radius: 28px;
    background: var(--surface);
    border: 1px solid var(--outlineVariant);
    overflow: hidden;
  }

  /* ── ListRow: styles.wrap minHeight 56 ; row paddingV 12 gap 13 ── */
  .row-wrap { min-height: 56px; display: flex; justify-content: center; }
  .row-wrap + .row-wrap { /* visual divider between stacked rows (RN has none; subtle for clarity) */ }
  .row {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 12px 0;
    gap: 13px;
  }
  /* leadingTint icon square: 34×34 radius 11, bg `${tint}22` (tint=#33A089 -> #33A08922) */
  .icon-square {
    width: 34px; height: 34px;
    border-radius: 11px;
    background: rgba(51,160,137,0.133);   /* #33A089 @ 0x22 */
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .row-texts { flex: 1; min-width: 0; }
  .row-title {
    font-size: 15px;
    font-weight: 600;             /* semibold */
    color: var(--onSurface);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-subtitle {
    font-size: 12.5px;
    font-weight: 500;             /* medium */
    color: var(--onSurfaceVariant);
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 4px;
  }
  .row-value {
    font-size: 13px;
    font-weight: 500;
    color: var(--onSurfaceVariant);
    white-space: nowrap;
  }
  .chevron {
    font-size: 22px;
    font-weight: 400;
    color: var(--onSurfaceVariant);
    margin-left: 2px;
    margin-top: -2px;
    line-height: 1;
  }
  /* NEW trophy pill inside subtitle */
  .new-badge {
    display: inline-flex; align-items: center; gap: 3px;
    color: var(--primary);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <!-- Fixture: recordsTabFull (records tab active, summary grid + full record list) — real FR strings from RunRecordsView.fixtures.ts -->
  <div class="device">

    <!-- TOP SAFE-AREA (54px) — status bar so header/back-arrow never clipped at y=0 -->
    <div class="statusbar">

      </div>

      <!-- List section -->
      <div class="section-title spaced">Tous tes records</div>
      <div class="list-card">

        <!-- r5k : "Plus rapide 5 km" · "aujourd'hui · NEW 🏆" → flat trophy icon, mint value, chevron -->
        <div class="row-wrap">
          <div class="row">
            <div class="icon-square">

        <!-- r10k -->

                <path d="M7 5H4.5a2.5 2.5 0 0 0 2.5 2.5M17 5h2.5A2.5 2.5 0 0 1 17 7.5" stroke="#33A089" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M12 12v3m-3 4h6m-5 0a3 3 0 0 1 4 0" stroke="#33A089" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
