<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SessionDetailView — V2 Dark</title>
<style>
  /* ===== V2 DARK TOKENS (exact) ===== */
  :root{
    --surface:#0A0E1A;
    --surfaceContainer:#161B2A;
    --surfaceContainerHigh:#1E2435;
    --onSurface:#FFFFFF;
    --onSurfaceVariant:#94A3B8;
    --outline:#2A3142;
    --outlineVariant:#222838;
    --mint:#33A089;          /* primary */
    --skeleton:#1A2030;
    /* status confirmed (dark): bg #5BB8A6 -> near-black ink */
    --statusBg:#5BB8A6;
    --statusInk:#0A0E1A;
    /* cancel ink (dark danger constant) */
    --cancelInk:#F87171;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#05070F;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;}
  body{display:flex;justify-content:center;align-items:flex-start;padding:24px 0;}

  /* ===== DEVICE FRAME 393x852 ===== */
  .device{
    position:relative;
    width:393px;height:852px;
    background:var(--surface);
    border-radius:46px;
    overflow:hidden;
    box-shadow:0 0 0 11px #0d0f16,0 0 0 13px #1d212c,0 30px 80px rgba(0,0,0,.6);
  }

  /* faux iOS status bar (within top safe-area inset) */
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:54px;
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 26px 8px;
    font-size:14px;font-weight:600;color:var(--onSurface);
    z-index:30;pointer-events:none;
  }
  .statusbar .time{font-weight:700;letter-spacing:.3px;}
  .statusbar .glyphs{display:flex;align-items:center;gap:6px;}
  .statusbar .glyphs svg{display:block;}
  .notch{
    position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:122px;height:34px;background:#000;border-radius:20px;z-index:31;
  }

  /* root = full height column; content starts BELOW 54px safe-area inset */
  .root{
    position:absolute;top:54px;left:0;right:0;bottom:0;
    display:flex;flex-direction:column;
    background:var(--surface);
  }

  /* ===== HEADER ===== */
  .header{
    flex:0 0 auto;
    display:flex;flex-direction:row;align-items:center;justify-content:space-between;
    padding:12px 12px;
    border-bottom:0.5px solid var(--outline);
  }
  .headerBtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;}
  .headerGlyph{font-size:26px;font-weight:800;color:var(--onSurface);line-height:1;}
  .headerTitle{
    flex:1;text-align:center;font-size:16px;font-weight:800;
    color:var(--onSurface);margin:0 8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* ===== SCROLL BODY ===== */
  .scroll{
    flex:1 1 auto;overflow-y:auto;
    padding:16px;padding-bottom:30px;
  }
  .scroll::-webkit-scrollbar{display:none;}

  /* coach card */
  .coachCard{
    display:flex;flex-direction:row;align-items:center;
    border-radius:18px;border:0.5px solid var(--outline);
    background:var(--surfaceContainer);
    padding:14px;min-height:44px;margin-bottom:16px;
  }
  .coachAvatar{margin-right:12px;}
  .avatarSlot{
    width:48px;height:48px;border-radius:999px;
    background:linear-gradient(135deg,#2A3142,#1E2435);
    border:1px solid var(--outline);
    display:flex;align-items:center;justify-content:center;
    color:var(--onSurfaceVariant);font-size:18px;font-weight:700;
  }
  .coachText{flex:1;min-width:0;}
  .coachNameRow{display:flex;flex-direction:row;align-items:center;gap:6px;}
  .coachName{font-size:16px;font-weight:700;color:var(--onSurface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .verifiedGlyph{font-size:14px;font-weight:800;color:var(--mint);line-height:1;}
  .coachChevron{font-size:24px;font-weight:700;color:var(--onSurfaceVariant);margin-left:8px;line-height:1;}

  /* status chip (meaning graphic) */
  .statusChip{
    align-self:flex-start;display:inline-flex;flex-direction:row;align-items:center;
    padding:8px 14px;border-radius:999px;margin-bottom:8px;
    background:var(--statusBg);
  }
  .statusText{font-size:13px;font-weight:700;color:var(--statusInk);white-space:nowrap;}

  /* sections */
  .section{margin-top:16px;}
  .heading{font-size:15px;font-weight:700;color:var(--onSurface);margin-bottom:12px;}

  /* info card */
  .infoCard{
    border-radius:18px;border:0.5px solid var(--outline);
    background:var(--surfaceContainer);
    padding:0 14px;
  }
  .infoRow{display:flex;flex-direction:row;align-items:center;padding:12px 0;}
  .infoTexts{flex:1;min-width:0;}
  .infoLabel{font-size:12px;font-weight:500;color:var(--onSurfaceVariant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .infoValue{font-size:15px;font-weight:600;color:var(--onSurface);margin-top:2px;}

  /* action card */
  .actionCard{
    border-radius:18px;border:0.5px solid var(--outline);
    background:var(--surfaceContainer);
    overflow:hidden;
  }
  .actionRow{
    display:flex;flex-direction:row;align-items:center;
    min-height:44px;padding:14px;
    border-bottom:0.5px solid var(--outlineVariant);
  }
  .actionText{flex:1;font-size:15px;font-weight:600;color:var(--onSurface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .actionChevron{font-size:22px;font-weight:700;color:var(--onSurfaceVariant);margin-left:8px;line-height:1;}
  .cancelRow{border-bottom:0;}
  .actionIconGlyph{width:28px;margin-right:12px;font-size:20px;font-weight:800;text-align:center;color:var(--cancelInk);line-height:1;}
  .cancelText{color:var(--cancelInk);}

  /* ===== STICKY BOTTOM JOIN CTA ===== */
  .bottomBar{
    flex:0 0 auto;
    padding:12px 20px 20px;
    border-top:0.5px solid var(--outline);
    background:var(--surfaceContainerHigh);
  }
  .btnGradient{
    width:100%;height:54px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#1A7D68,#157082);
    color:#FFFFFF;font-size:16px;font-weight:700;
    letter-spacing:.2px;
  }
</style>
</head>
<body>
  <div class="device">
    <div class="notch"></div>
    <!-- faux iOS status bar (top safe-area inset, 54px) -->
    <div class="statusbar">
      <span class="time">9:41</span>
      <span class="glyphs">
        <!-- cellular -->
        <svg width="18" height="11" viewBox="0 0 18 11" fill="none"><rect x="0" y="7" width="3" height="4" rx="1" fill="#fff"/><rect x="5" y="5" width="3" height="6" rx="1" fill="#fff"/><rect x="10" y="2.5" width="3" height="8.5" rx="1" fill="#fff"/><rect x="15" y="0" width="3" height="11" rx="1" fill="#fff"/></svg>
        <!-- wifi -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 2.2c2.7 0 5.2 1 7 2.7l-1.5 1.6A8 8 0 0 0 8.5 4.3 8 8 0 0 0 3 6.5L1.5 4.9A10 10 0 0 1 8.5 2.2Z" fill="#fff"/><path d="M8.5 6.1c1.5 0 2.9.6 4 1.6L8.5 12 4.5 7.7a5.6 5.6 0 0 1 4-1.6Z" fill="#fff"/></svg>
        <!-- battery -->
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="#fff" opacity="0.45"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#fff"/><rect x="24" y="4" width="1.5" height="4" rx="0.75" fill="#fff" opacity="0.45"/></svg>
      </span>
    </div>

    <div class="root">
      <!-- ===== HEADER: back · title ===== -->
      <div class="header">
        <div class="headerBtn"><span class="headerGlyph">&#8249;</span></div>
        <div class="headerTitle">Détail de la session</div>
        <div class="headerBtn"></div>
      </div>

      <!-- ===== SCROLL BODY ===== -->
      <div class="scroll">

        <!-- coach card -->
        <div class="coachCard">
          <div class="coachAvatar">
            <div class="avatarSlot">SK</div>
          </div>
          <div class="coachText">
            <div class="coachNameRow">
              <span class="coachName">Sara Khan</span>
              <span class="verifiedGlyph">&#10003;</span>
            </div>
          </div>
          <span class="coachChevron">&#8250;</span>
        </div>

        <!-- status chip (confirmed → meaning graphic) -->
        <div class="statusChip"><span class="statusText">Confirmée</span></div>

        <!-- info card -->
        <div class="section">
          <div class="heading">Informations</div>
          <div class="infoCard">
            <div class="infoRow">
              <div class="infoTexts">
                <div class="infoLabel">Date</div>
                <div class="infoValue">Mer. 5 juin 2026</div>
              </div>
            </div>
            <div class="infoRow">
              <div class="infoTexts">
                <div class="infoLabel">Heure</div>
                <div class="infoValue">14:00</div>
              </div>
            </div>
            <div class="infoRow">
              <div class="infoTexts">
                <div class="infoLabel">Durée</div>
                <div class="infoValue">60 min</div>
              </div>
            </div>
            <div class="infoRow">
              <div class="infoTexts">
                <div class="infoLabel">Pack</div>
                <div class="infoValue">Pack coaching · 5 sessions</div>
              </div>
            </div>
            <div class="infoRow">
              <div class="infoTexts">
                <div class="infoLabel">Prix payé</div>
                <div class="infoValue">28 $</div>
              </div>
            </div>
          </div>
        </div>

        <!-- action rows + destructive cancel -->
        <div class="section">
          <div class="heading">Actions</div>
          <div class="actionCard">
            <div class="actionRow">
              <span class="actionText">Ajouter au calendrier</span>
              <span class="actionChevron">&#8250;</span>
            </div>
            <div class="actionRow">
              <span class="actionText">Envoyer un message</span>
              <span class="actionChevron">&#8250;</span>
            </div>
            <div class="actionRow">
              <span class="actionText">Reprogrammer</span>
              <span class="actionChevron">&#8250;</span>
            </div>
            <!-- destructive cancel row (money mutation) -->
            <div class="actionRow cancelRow">
              <span class="actionIconGlyph">&#215;</span>
              <span class="actionText cancelText">Annuler la session</span>
            </div>
          </div>
        </div>

      </div>

      <!-- ===== STICKY BOTTOM JOIN CTA (live call) ===== -->
      <div class="bottomBar">
        <div class="btnGradient">Rejoindre l'appel</div>
      </div>
    </div>
  </div>
</body>
</html>
