<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PeerRatingView — V2 Dark</title>
<style>
  :root {
    --surface: #0A0E1A;
    --surfaceContainer: #161B2A;
    --surfaceContainerHigh: #1E2435;
    --onSurface: #FFFFFF;
    --onSurfaceVariant: #94A3B8;
    --outline: #2A3142;
    --mint: #33A089;
    --primaryDeep: #157082;
    --primarySoft: #14322E;
    --star: #FBBF24;
    --danger: #F87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body {
    background: #05070d;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 32px 0;
  }
  .device {
    width: 393px;
    height: 852px;
    background: var(--surface);
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
  }

  /* ── Faux iOS status bar ─────────────────────────── */
  .statusbar {
    height: 54px;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 26px 8px;
    color: var(--onSurface);
    font-size: 15px;
    font-weight: 600;
  }
  .statusbar .right { display: flex; align-items: center; gap: 6px; }
  .sb-bat {
    width: 24px; height: 12px; border: 1.5px solid var(--onSurface);
    border-radius: 3px; position: relative; opacity: 0.95;
  }
  .sb-bat::after {
    content: ""; position: absolute; right: -3px; top: 3px;
    width: 2px; height: 6px; background: var(--onSurface); border-radius: 0 1px 1px 0;
  }
  .sb-bat::before {
    content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px;
    width: 70%; background: var(--onSurface); border-radius: 1px;
  }
  .sb-net { display: flex; align-items: flex-end; gap: 2px; height: 11px; }
  .sb-net i { width: 3px; background: var(--onSurface); border-radius: 1px; }
  .sb-net i:nth-child(1){height:4px}.sb-net i:nth-child(2){height:6px}
  .sb-net i:nth-child(3){height:8px}.sb-net i:nth-child(4){height:11px}

  /* ── Header bar ─────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--outline);
    flex-shrink: 0;
  }
  .header-btn {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
  }
  .header-glyph {
    font-size: 30px; font-weight: 800; color: var(--onSurface); line-height: 1;
  }
  .header-center {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .header-title {
    text-align: center; font-size: 17px; font-weight: 800; color: var(--onSurface);
    max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .progress-chip {
    background: var(--primarySoft);
    border-radius: 999px;
    padding: 3px 12px;
  }
  .progress-text {
    font-size: 12.5px; font-weight: 700; color: var(--mint);
    font-variant-numeric: tabular-nums; letter-spacing: 0.2px;
  }

  /* ── Rate scroll body ─────────────────────────── */
  .rate-scroll {
    flex: 1;
    overflow: hidden;
    padding: 8px 20px 40px;
  }
  .group { margin-bottom: 18px; }
  .group-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .group-icon {
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
  }
  .group-title { font-size: 16px; font-weight: 800; color: var(--onSurface); }

  .ability-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; gap: 12px;
    border-bottom: 1px solid var(--outline);
  }
  .ability-label {
    flex: 1; font-size: 14.5px; font-weight: 500; color: var(--onSurface);
    line-height: 1.3;
  }
  .ability-stars { display: flex; align-items: center; }
  .pick-star {
    min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: center;
  }
  .pick-star-inner {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
  }
  .star-svg { width: 24px; height: 24px; display: block; }

  /* ── Comment ─────────────────────────── */
  .comment-wrap {
    border: 1px solid var(--outline);
    background: var(--surface);
    border-radius: 12px;
    padding: 12px;
    margin-top: 8px;
    min-height: 80px;
  }
  .comment-placeholder {
    font-size: 14.5px; font-weight: 400; color: var(--onSurfaceVariant);
  }
  .char-counter {
    font-size: 12px; font-weight: 500; color: var(--onSurfaceVariant);
    text-align: right; margin-top: 6px;
  }

  /* ── Footer CTA ─────────────────────────── */
  .footer {
    padding: 12px 20px 20px;
    border-top: 1px solid var(--outline);
    flex-shrink: 0;
  }
  .btn-gradient {
    width: 100%;
    height: 52px;
    border-radius: 999px;
    background: linear-gradient(135deg, #1A7D68, #157082);
    display: flex; align-items: center; justify-content: center;
    border: none;
  }
  .btn-gradient span {
    color: #FFFFFF; font-size: 17px; font-weight: 600; letter-spacing: 0.2px;
  }

  /* Home indicator */
  .home-indicator {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 8px; width: 134px; height: 5px; border-radius: 3px;
    background: rgba(255,255,255,0.32);
  }
</style>
</head>
