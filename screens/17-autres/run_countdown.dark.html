<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RunCountdownView · V2 Dark</title>
<style>
  :root {
    --surface: #0A0E1A;
    --surface-container: #161B2A;
    --surface-container-high: #1E2435;
    --on-surface: #FFFFFF;
    --on-surface-variant: #94A3B8;
    --outline: #2A3142;
    --mint: #33A089;
    --info: #60A5FA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #05070d;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  /* ---- Device frame 393x852 ---- */
  .device {
    position: relative;
    width: 393px;
    height: 852px;
    background: #000;            /* root: backgroundColor #000 */
    overflow: hidden;
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }

  /* ---- Layer 1: map slot (decorative, behind scrim) ---- */
  .map {
    position: absolute;
    inset: 0;
    /* faux live map — dark base + faint route line + grid */
    background:
      radial-gradient(circle at 30% 24%, rgba(51,160,137,0.18), transparent 42%),
      radial-gradient(circle at 74% 70%, rgba(96,165,250,0.10), transparent 46%),
      linear-gradient(160deg, #0d1422 0%, #0a111d 55%, #0b1320 100%);
  }
  .map::before {
    /* subtle map grid */
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(148,163,184,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,0.05) 1px, transparent 1px);
    background-size: 46px 46px;
  }
  .map .route {
    position: absolute;
    inset: 0;
  }

  /* ---- Layer 2: dimming scrim rgba(0,0,0,0.55) ---- */
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
  }

  /* ---- iOS status bar (over the scrim) ---- */
  .statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;                 /* top safe-area inset */
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 26px 0;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    z-index: 5;
    pointer-events: none;
  }
  .statusbar .clock { letter-spacing: 0.2px; }
  .statusbar .icons { display: flex; align-items: center; gap: 7px; }
  .statusbar .icons svg { display: block; }

  /* ---- Layer 3: centered count + caption ---- */
  .center {
    position: absolute;
    top: 54px;                    /* below safe-area inset */
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }
  .count {
    color: #fff;
    font-size: 120px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    /* textShadowColor primaryAccent (mint) + radius 24 -> mint glow */
    text-shadow:
      0 0 24px rgba(51,160,137,0.95),
      0 0 48px rgba(51,160,137,0.55);
  }
  .caption {
    color: rgba(255,255,255,0.85);
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
  }

  /* ---- Cancel pill (bottom) ---- */
  .cancel {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 44px;                 /* marginBottom 44 */
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 26px;
    border-radius: 999px;
    background: rgba(255,255,255,0.16);
    z-index: 4;
  }
  .cancel-text {
    color: #fff;
    font-size: 14px;
    font-weight: 700;
  }

  /* home indicator */
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    border-radius: 999px;
    background: rgba(255,255,255,0.5);
    z-index: 6;
  }
</style>
</head>
<body>
  <div class="device">

    <!-- Layer 1: decorative live map behind the scrim -->
    <div class="map" aria-hidden="true">
      <svg class="route" viewBox="0 0 393 852" preserveAspectRatio="xMidYMid slice">
        <path d="M60 700 C 120 560, 90 460, 180 400 S 320 320, 300 200 S 210 120, 270 60"
              fill="none" stroke="#33A089" stroke-width="5" stroke-linecap="round"
              stroke-opacity="0.55" />
        <circle cx="60" cy="700" r="9" fill="#33A089" fill-opacity="0.85" />
        <circle cx="270" cy="60" r="7" fill="#60A5FA" fill-opacity="0.8" />
      </svg>
    </div>

    <!-- Layer 2: dimming scrim -->
    <div class="scrim" aria-hidden="true"></div>

    <!-- Faux iOS status bar within top safe-area inset -->
    <div class="statusbar">
      <span class="clock">9:41</span>
      <span class="icons">
        <!-- cellular -->
        <svg width="18" height="11" viewBox="0 0 18 11" fill="#fff">
          <rect x="0" y="7" width="3" height="4" rx="1"/>
          <rect x="5" y="5" width="3" height="6" rx="1"/>
          <rect x="10" y="2.5" width="3" height="8.5" rx="1"/>
          <rect x="15" y="0" width="3" height="11" rx="1"/>
        </svg>
        <!-- wifi -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <path d="M8.5 2.2C11.4 2.2 14 3.4 15.8 5.2L17 4C14.8 1.8 11.8 0.5 8.5 0.5S2.2 1.8 0 4l1.2 1.2C3 3.4 5.6 2.2 8.5 2.2z" fill="#fff"/>
          <path d="M8.5 5.4C10.1 5.4 11.6 6 12.7 7.1l1.2-1.2C12.4 4.4 10.5 3.6 8.5 3.6S4.6 4.4 3.1 5.9l1.2 1.2C5.4 6 6.9 5.4 8.5 5.4z" fill="#fff"/>
          <path d="M8.5 8.4l2-2A2.83 2.83 0 008.5 5.6 2.83 2.83 0 006.5 6.4l2 2z" fill="#fff"/>
        </svg>
        <!-- battery -->
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
          <rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke="#fff" stroke-opacity="0.55"/>
          <rect x="2" y="2" width="18" height="8" rx="1.5" fill="#fff"/>
          <rect x="24" y="4" width="1.6" height="4" rx="0.8" fill="#fff" fill-opacity="0.55"/>
        </svg>
      </span>
    </div>

    <!-- Layer 3: count + caption -->
    <div class="center" role="timer" aria-label="Départ dans 3">
      <div class="count">3</div>
      <div class="caption">Prépare-toi…</div>
    </div>

    <!-- Cancel pill -->
    <div class="cancel" role="button" aria-label="Annuler le compte à rebours">
      <span class="cancel-text">Annuler</span>
    </div>

    <div class="home-indicator"></div>
  </div>
</body>
</html>
