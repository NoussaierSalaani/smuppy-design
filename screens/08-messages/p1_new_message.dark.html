<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Smuppy V2 — Nouveau message (Dark)</title>
<style>
  :root {
    --mint:#33A089;
    --surface:#0A0E1A; --container:#161B2A;
    --text:#FFFFFF; --variant:#94A3B8; --outline:#2A3142;
    --logo:#33A089;
    --grad-a:#1A7D68; --grad-b:#157082;
  }
  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html, body { background:#000; }
  body {
    width:393px; height:852px; overflow:hidden; position:relative;
    background:var(--surface); color:var(--text);
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    font-size:15px; line-height:1.5;
  }

  /* ── Faux iOS status bar ─────────────────────────────────── */
  .ios-status { position:absolute; top:0; left:0; right:0; height:54px; z-index:30;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 22px 8px; pointer-events:none; }
  .ios-time { font-size:15px; font-weight:700; color:var(--text); letter-spacing:.02em; }
  .ios-right { display:flex; align-items:center; gap:6px; }
  .ios-right svg { display:block; }

  /* ── Sub-screen header (below 54px safe-area) ────────────── */
  .hdr { position:absolute; top:54px; left:0; right:0; z-index:20;
    height:56px; padding:0 14px;
    display:flex; align-items:center; gap:10px;
    background:var(--surface);
    border-bottom:1px solid var(--outline); }
  .hdr-back { width:38px; height:38px; flex-shrink:0; border:1px solid var(--outline);
    background:var(--container); border-radius:999px; color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .hdr-title { flex:1; text-align:center; font-size:17px; font-weight:800;
    color:var(--text); letter-spacing:-.01em; }
  .hdr-spacer { width:38px; flex-shrink:0; }

  /* ── Content ─────────────────────────────────────────────── */
  .main { position:absolute; top:110px; left:0; right:0; bottom:0;
    padding:14px 18px 18px; overflow:hidden; }

  /* Search */
  .search { display:flex; align-items:center; gap:10px;
    padding:11px 14px; margin:0 0 14px;
    background:var(--container); border:1px solid var(--outline);
    border-radius:14px; }
  .search-ic { flex-shrink:0; color:var(--variant); }
  .search-val { font-size:14px; font-weight:600; color:var(--text); }

  /* Create group button */
  .new-group { display:flex; align-items:center; gap:12px; width:100%;
    padding:13px 14px; margin:0 0 16px; border-radius:16px;
    background:rgba(51,160,137,.08); border:1px solid rgba(51,160,137,.35);
    color:var(--text); font-family:inherit; font-size:14px; font-weight:700;
    cursor:pointer; text-align:left; }
  .new-group-ic { width:36px; height:36px; border-radius:11px; flex-shrink:0;
    background:rgba(51,160,137,.16);
    display:inline-flex; align-items:center; justify-content:center; color:var(--mint); }
  .new-group-lbl { flex:1; }
  .new-group-chev { color:var(--variant); flex-shrink:0; }

  /* Section title */
  .sec-title { font-size:11px; font-weight:800; color:var(--variant);
    margin:0 0 10px 4px; text-transform:uppercase; letter-spacing:.10em; }

  /* ── User CARDS (correction: liste users en cards) ───────── */
  .user-cards { display:flex; flex-direction:column; gap:8px; }
  .user-card { display:flex; align-items:center; gap:12px;
    padding:11px 12px; border-radius:16px;
    background:var(--container); border:1px solid var(--outline);
    cursor:pointer; }
  .uc-avatar-wrap { position:relative; flex-shrink:0; }
  .uc-avatar { width:46px; height:46px; border-radius:999px; object-fit:cover;
    display:block; border:1px solid var(--outline); }
  .uc-online { position:absolute; bottom:0; right:0; width:13px; height:13px;
    border-radius:999px; background:var(--mint); border:2.5px solid var(--container); }
  .uc-text { flex:1; min-width:0; }
  .uc-name { font-size:14px; font-weight:700; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .uc-sub { font-size:11.5px; font-weight:500; color:var(--variant); margin-top:2px; }
  .uc-add { width:34px; height:34px; flex-shrink:0; border-radius:999px;
    border:1px solid rgba(51,160,137,.45); background:rgba(51,160,137,.10);
    color:var(--mint); display:flex; align-items:center; justify-content:center;
    cursor:pointer; }
</style>
</head><body>

<!-- Faux iOS status bar -->
<div class="ios-status">
  <span class="ios-time">9:41</span>
  <span class="ios-right">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="var(--text)"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="var(--text)" stroke-width="1.4"><path d="M1 4.5C4.5 1.5 12.5 1.5 16 4.5M3.5 7C6 5 11 5 13.5 7M6 9.3c1.5-1.2 3.5-1.2 5 0" stroke-linecap="round"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="var(--text)" opacity=".5"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="var(--text)"/><rect x="23" y="3.5" width="2" height="5" rx="1" fill="var(--text)" opacity=".5"/></svg>
  </span>
</div>

<!-- Sub-screen header -->
<header class="hdr">
  <button class="hdr-back" aria-label="Retour">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <h1 class="hdr-title">Nouveau message</h1>
  <span class="hdr-spacer"></span>
</header>

<main class="main">
  <!-- Search -->
  <div class="search">
    <svg class="search-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span class="search-val">Sara</span>
  </div>

  <!-- Create group -->
  <button class="new-group">
    <span class="new-group-ic">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </span>
    <span class="new-group-lbl">Créer un groupe</span>
    <svg class="new-group-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>

  <!-- Suggestions — USERS EN CARDS -->
  <h3 class="sec-title">Suggestions</h3>
  <div class="user-cards">

    <div class="user-card">
      <span class="uc-avatar-wrap">
        <img class="uc-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120&h=120&fit=crop&q=80" alt=""/>
        <span class="uc-online"></span>
      </span>
      <div class="uc-text">
        <div class="uc-name">Emma Chen</div>
        <div class="uc-sub">En ligne</div>
      </div>
      <button class="uc-add" aria-label="Ajouter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="user-card">
      <span class="uc-avatar-wrap">
        <img class="uc-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&h=120&fit=crop&crop=face&q=80" alt=""/>
        <span class="uc-online"></span>
      </span>
      <div class="uc-text">
        <div class="uc-name">Marc Dubois</div>
        <div class="uc-sub">En ligne</div>
      </div>
      <button class="uc-add" aria-label="Ajouter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="user-card">
      <span class="uc-avatar-wrap">
        <img class="uc-avatar" src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=120&h=120&fit=crop&q=80" alt=""/>
      </span>
      <div class="uc-text">
        <div class="uc-name">Léa Martin</div>
        <div class="uc-sub">Vue il y a 2 h</div>
      </div>
      <button class="uc-add" aria-label="Ajouter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="user-card">
      <span class="uc-avatar-wrap">
        <img class="uc-avatar" src="https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?w=120&h=120&fit=crop&q=80" alt=""/>
      </span>
      <div class="uc-text">
        <div class="uc-name">Thomas Roy</div>
        <div class="uc-sub">Vue hier</div>
      </div>
      <button class="uc-add" aria-label="Ajouter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

    <div class="user-card">
      <span class="uc-avatar-wrap">
        <img class="uc-avatar" src="https://images.unsplash.com/photo-1517999144091-3d9dca6d1e43?w=120&h=120&fit=crop&q=80" alt=""/>
      </span>
      <div class="uc-text">
        <div class="uc-name">Coach Mike</div>
        <div class="uc-sub">Vue il y a 3 j</div>
      </div>
      <button class="uc-add" aria-label="Ajouter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>

  </div>
</main>

</body></html>
