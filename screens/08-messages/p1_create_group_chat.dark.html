<!DOCTYPE html>
<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Smuppy V2 — Nouveau groupe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root {
    --mint: #33A089; --grad-a: #1A7D68; --grad-b: #157082;
    --surface: #0A0E1A; --container: #161B2A;
    --text: #FFFFFF; --variant: #94A3B8; --outline: #2A3142;
    --input-bg: rgba(255,255,255,0.04);
  }
  * { box-sizing:border-box; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html { background:#000; }
  body {
    width:393px; height:852px; overflow:hidden; margin:0 auto;
    background:var(--surface); color:var(--text);
    font-family:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;
    font-size:15px; line-height:1.5; position:relative;
  }

  /* ── iOS status bar (faux) ──────────────────────────────────── */
  .ios-status { position:absolute; top:0; left:0; right:0; height:54px; z-index:30;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 22px 8px; pointer-events:none; }
  .ios-time { font-size:15px; font-weight:700; color:var(--text); letter-spacing:.02em; }
  .ios-right { display:flex; align-items:center; gap:6px; color:var(--text); }

  /* ── Sub-screen header (back chevron in circle + center title) ─ */
  .hdr { position:absolute; top:54px; left:0; right:0; z-index:20;
    height:56px; padding:0 14px;
    display:flex; align-items:center; gap:8px; }
  .hdr-back { width:40px; height:40px; border:none; border-radius:999px;
    background:var(--container); border:1px solid var(--outline);
    color:var(--text); cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; }
  .hdr-title { flex:1; text-align:center; font-size:17px; font-weight:800;
    color:var(--text); letter-spacing:-.01em; }

  /* ── Main ───────────────────────────────────────────────────── */
  .main { position:absolute; top:110px; left:0; right:0; bottom:0;
    padding:8px 18px 18px; overflow:hidden; }

  /* Group avatar */
  .group-avatar { display:flex; flex-direction:column; align-items:center; gap:7px;
    margin:2px 0 14px; }
  .group-avatar-wrap { width:84px; height:84px; border-radius:22px;
    background:rgba(51,160,137,.10);
    border:2px dashed rgba(51,160,137,.45);
    display:flex; align-items:center; justify-content:center; }
  .group-avatar-lbl { font-size:12px; font-weight:700; color:var(--mint); }

  /* Input */
  .field { margin:0 0 16px; }
  .field-lbl { display:block; font-size:11px; font-weight:700;
    color:var(--variant); margin:0 0 6px 4px;
    text-transform:uppercase; letter-spacing:.08em; }
  .field-box { position:relative; display:flex; align-items:center;
    height:50px; padding:0 16px 0 44px; border-radius:14px;
    background:var(--input-bg); border:1.5px solid var(--outline); }
  .field-box .ic { position:absolute; left:15px; top:50%; transform:translateY(-50%);
    color:var(--variant); }
  .field-val { color:var(--text); font-size:15px; font-weight:500; }

  /* Section title */
  .sec-title { font-size:11px; font-weight:800; color:var(--variant);
    margin:0 0 8px 4px; text-transform:uppercase; letter-spacing:.10em; }

  /* ── Members as CARDS (correction) ──────────────────────────── */
  .mb-cards { display:flex; flex-direction:column; gap:8px; margin:0 0 12px; }
  .mb-card { display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:16px;
    background:var(--container); border:1px solid var(--outline); }
  .mb-card-admin { border-color:rgba(51,160,137,.40);
    background:linear-gradient(135deg, rgba(51,160,137,.12), rgba(21,112,130,.05)); }
  .mb-card-avatar { width:44px; height:44px; border-radius:999px; object-fit:cover; flex-shrink:0; }
  .mb-card-admin-ic { width:44px; height:44px; border-radius:999px; flex-shrink:0;
    background:linear-gradient(135deg, var(--grad-a), var(--grad-b));
    display:flex; align-items:center; justify-content:center; }
  .mb-card-text { flex:1; min-width:0; }
  .mb-card-name { font-size:14px; font-weight:700; color:var(--text); }
  .mb-card-sub { font-size:11.5px; font-weight:600; color:var(--variant); margin-top:1px; }
  .mb-card-sub-admin { color:var(--mint); }
  .mb-card-x { width:30px; height:30px; border-radius:999px; border:1px solid var(--outline);
    background:var(--input-bg); color:var(--variant); cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; }

  /* Add members — chip style (mint text + mint contour, transparent) */
  .mb-add { display:flex; align-items:center; justify-content:center; gap:7px;
    width:100%; padding:11px 14px; border-radius:14px;
    background:transparent; border:1.5px dashed rgba(51,160,137,.50);
    color:var(--mint); font-family:inherit; font-size:13px; font-weight:700;
    cursor:pointer; }

  /* CTA */
  .cta { display:flex; align-items:center; justify-content:center;
    width:100%; height:52px; margin-top:16px; border:none; border-radius:999px;
    background:linear-gradient(135deg, var(--grad-a), var(--grad-b));
    color:#FFFFFF; font-family:inherit; font-size:15px; font-weight:800;
    cursor:pointer; letter-spacing:.01em; }
</style>
</head><body>

<!-- iOS status bar -->
<div class="ios-status">
  <span class="ios-time">9:41</span>
  <span class="ios-right">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.5C11 2.5 13.2 3.5 14.8 5.1l1.1-1.4C13.9 1.8 11.3.6 8.5.6S3.1 1.8 1.1 3.7l1.1 1.4C3.8 3.5 6 2.5 8.5 2.5z" opacity=".5"/><path d="M8.5 6c1.3 0 2.5.5 3.4 1.4l-3.4 4.1-3.4-4.1C6 6.5 7.2 6 8.5 6z"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="3" stroke="currentColor" opacity=".5"/><rect x="3" y="3" width="15" height="6" rx="1.5" fill="currentColor"/><rect x="22.5" y="4" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".5"/></svg>
  </span>
</div>

<!-- Sub-screen header -->
<header class="hdr">
  <button class="hdr-back" aria-label="Retour">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <span class="hdr-title">Nouveau groupe</span>
  <span style="width:40px"></span>
</header>

<main class="main">

  <div class="group-avatar">
    <div class="group-avatar-wrap">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#33A089" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </div>
    <p class="group-avatar-lbl">Photo du groupe</p>
  </div>

  <div class="field">
    <span class="field-lbl">Nom du groupe</span>
    <div class="field-box">
      <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="field-val">Team Yoga Premium</span>
    </div>
  </div>

  <h3 class="sec-title">Membres · 5</h3>

  <!-- Members as CARDS -->
  <div class="mb-cards">
    <div class="mb-card mb-card-admin">
      <div class="mb-card-admin-ic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="mb-card-text">
        <div class="mb-card-name">Toi</div>
        <div class="mb-card-sub mb-card-sub-admin">Administrateur</div>
      </div>
    </div>
    <div class="mb-card">
      <img class="mb-card-avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=120&h=120&fit=crop&q=80"/>
      <div class="mb-card-text"><div class="mb-card-name">Emma</div><div class="mb-card-sub">@emma.yoga</div></div>
      <button class="mb-card-x"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="mb-card">
      <img class="mb-card-avatar" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=120&h=120&fit=crop&crop=face&q=80"/>
      <div class="mb-card-text"><div class="mb-card-name">Marc</div><div class="mb-card-sub">@marc.fit</div></div>
      <button class="mb-card-x"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="mb-card">
      <img class="mb-card-avatar" src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=120&h=120&fit=crop&q=80"/>
      <div class="mb-card-text"><div class="mb-card-name">Léa</div><div class="mb-card-sub">@lea.pilates</div></div>
      <button class="mb-card-x"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="mb-card">
      <img class="mb-card-avatar" src="https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?w=120&h=120&fit=crop&q=80"/>
      <div class="mb-card-text"><div class="mb-card-name">Thomas</div><div class="mb-card-sub">@thomas.run</div></div>
      <button class="mb-card-x"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
  </div>

  <button class="mb-add">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span>Ajouter des membres</span>
  </button>

  <button class="cta">Créer le groupe</button>
</main>
</body></html>
