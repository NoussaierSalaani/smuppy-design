<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../APP_STORE_SCREENSHOTS/_html/_base.css">
<style>
/* full-screen paywall layout (no caption band, no device frame) */
body{display:block}
.screen.full{position:relative;width:645px;height:1398px;padding:0;overflow:hidden;
  background:radial-gradient(120% 60% at 50% -8%, #07221b 0%, #04090c 50%, #000 82%)}
.statusbar{position:absolute;top:26px;left:0;right:0;z-index:55;
  display:flex;justify-content:space-between;padding:0 54px;
  color:#dff5ee;font-size:24px;font-weight:600;opacity:.92}
.hdr{position:relative;z-index:10;display:flex;align-items:center;gap:18px;padding:84px 40px 10px}
.hdr .back{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.06);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  color:#dff5ee;font-size:30px;flex:none}
.hdr .ttl{color:#fff;font-size:34px;font-weight:800;letter-spacing:-.4px}
.body{position:relative;z-index:5;padding:8px 40px 0}
.hero{margin:18px 0 6px;border-radius:30px;padding:42px 34px 38px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0c2a22,#06140f);border:1px solid var(--line)}
.hero::after{content:"";position:absolute;top:-70px;right:-50px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(91,240,200,.30),transparent 70%)}
.hero .badge-icon{width:88px;height:88px;border-radius:26px;margin:0 auto 16px;display:flex;
  align-items:center;justify-content:center;font-size:46px;
  background:rgba(84,214,166,.14);border:1px solid rgba(91,240,200,.3);color:var(--mint);position:relative;z-index:2}
.hero .plan{color:var(--accent);font-size:21px;font-weight:700;letter-spacing:.3px;position:relative;z-index:2}
.hero .price{color:#fff;font-size:78px;font-weight:800;letter-spacing:-2.5px;margin-top:6px;line-height:1;position:relative;z-index:2}
.hero .price .per{color:#9fb0aa;font-size:30px;font-weight:600;letter-spacing:-.5px}
.hero .sub{color:#8fbfb0;font-size:18px;font-weight:500;margin-top:12px;position:relative;z-index:2}
.flist{margin:30px 6px 0;display:flex;flex-direction:column;gap:20px}
.frow{display:flex;align-items:center;gap:18px}
.frow .ck{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
  background:rgba(84,214,166,.14);border:1px solid rgba(91,240,200,.28);color:var(--mint);font-size:22px;font-weight:800}
.frow .ft{color:#EAF6F1;font-size:23px;font-weight:600}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:24px 40px 46px;
  background:linear-gradient(0deg,#000 30%,rgba(0,0,0,.86) 70%,transparent)}
.foot .cta.solid{font-size:24px;padding:21px 0;border-radius:999px;
  background:linear-gradient(180deg,#1A7D68 0%,#157082 100%);color:#FFFFFF;font-weight:700;border-color:transparent}
.foot .fine{color:#7E8B91;font-size:17px;text-align:center;margin-top:16px;letter-spacing:.2px}
</style></head><body>
<div class="screen full">
  <div class="statusbar"><span>9:41</span><span>5G ▪ 100%</span></div>
  <div class="hdr"><div class="back">‹</div><div class="ttl">Pro Creator Premium</div></div>
  <div class="body">
    <div class="hero">
      <div class="badge-icon">★</div>
      <div class="plan">Pro Creator Premium</div>
      <div class="price">$99.99<span class="per">/mois</span></div>
      <div class="sub">Débloque toute la monétisation créateur</div>
    </div>
    <div class="flist">
      <div class="frow"><div class="ck">✓</div><div class="ft">Monétisation complète</div></div>
      <div class="frow"><div class="ck">✓</div><div class="ft">Analytics &amp; insights</div></div>
      <div class="frow"><div class="ck">✓</div><div class="ft">Accès cashout</div></div>
      <div class="frow"><div class="ck">✓</div><div class="ft">Visibilité boostée</div></div>
      <div class="frow"><div class="ck">✓</div><div class="ft">Sessions privées payantes</div></div>
    </div>
  </div>
  <div class="foot">
    <div class="cta solid">S'abonner — $99.99/mois</div>
    <div class="fine">Renouvellement auto · annulable à tout moment</div>
  </div>
</div>
</body></html>
